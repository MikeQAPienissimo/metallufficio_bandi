<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCIAA → Preventivo Metallufficio</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Aptos,"Segoe UI",Arial,sans-serif;background:#fff}.bridge{height:100%;display:flex;flex-direction:column}.bar{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #e2e8f0;background:rgba(255,255,255,.98);backdrop-filter:blur(12px)}.bar b{display:block;font-family:"Arial Black",Arial,sans-serif;font-size:14px}.bar span{display:block;color:#64748b;font-size:10px;margin-top:2px}.btn{border:0;border-radius:12px;padding:11px 15px;color:#fff;font-weight:900;cursor:pointer;white-space:nowrap;background:linear-gradient(90deg,#E22B9C,#7C31AB,#069BC3)}.frame{width:100%;flex:1;min-height:1120px;border:0}.toast{position:fixed;right:18px;bottom:18px;z-index:50;background:#111827;color:#fff;border-radius:12px;padding:10px 13px;font-size:11px;opacity:0;transform:translateY(8px);transition:.18s}.toast.show{opacity:1;transform:none}@media(max-width:650px){.bar{align-items:flex-start;flex-direction:column}.btn{width:100%}.frame{min-height:1380px}}</style></head><body><div class="bridge"><div class="bar"><div><b>CCIAA · calcolo preventivo</b><span>Compila solo i dati utili e trasferisci il risultato in Quote.</span></div><button class="btn" id="send">Porta nel preventivo →</button></div><iframe id="wrapper" class="frame" src="./simulatore-cciaa.html" title="Simulatore CCIAA"></iframe></div><div class="toast" id="toast"></div><script>
const TARGET='https://quote-aziendali.netlify.app',wrapper=document.getElementById('wrapper');
const toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)};
const val=(d,id)=>d.getElementById(id)?.value||'';
function compactify(){try{const od=wrapper.contentDocument;if(!od)return;let ws=od.getElementById('mqQuoteCompactWrapper');if(!ws){ws=od.createElement('style');ws.id='mqQuoteCompactWrapper';ws.textContent='.header{display:none!important}.frame{height:1120px!important;min-height:1120px!important}html,body{height:auto!important;min-height:100%!important;overflow:auto!important;background:#fff!important}';od.head.appendChild(ws)}const nested=od.getElementById('sim');const apply=()=>{try{const d=nested?.contentDocument;if(!d)return;if(d.getElementById('mqQuoteCompactBase'))return;const s=d.createElement('style');s.id='mqQuoteCompactBase';s.textContent='body{background:#fff!important}.hero,.intro,.top-intro{display:none!important}.wrap{max-width:1180px!important}.panel,.card{margin-bottom:10px!important}.panel-head p,.card-head p,.info-btn,.kicker,.chips,.note,.disclaimer,.source-note{display:none!important}.panel-head,.card-head{padding:12px 14px!important}.panel-body,.card-body{padding:12px 14px!important}.field small,.req span,.status-card p{display:none!important}.layout{grid-template-columns:minmax(0,1fr)!important}.summary,.sidebar{position:static!important;top:auto!important;box-shadow:none!important}.grid2,.grid3{gap:8px!important}.extra-row{gap:7px!important}@media(max-width:700px){.panel-head,.panel-body,.card-head,.card-body{padding:10px!important}}';d.head.appendChild(s)}catch(e){console.warn(e)}};nested?.addEventListener('load',apply,{once:true});apply();setTimeout(apply,350)}catch(e){console.warn(e)}}
wrapper.addEventListener('load',()=>{compactify();setTimeout(compactify,350)});setTimeout(compactify,700);
function split(ow,amount,mode,rate){return typeof ow.vatSplit==='function'?ow.vatSplit(amount,mode,rate):{net:Number(amount)||0,vat:(Number(amount)||0)*(Number(rate)||0)/100,gross:(Number(amount)||0)*(1+(Number(rate)||0)/100)}}
function build(){try{const ow=wrapper.contentWindow,od=wrapper.contentDocument,nested=od?.getElementById('sim'),d=nested?.contentDocument;if(!ow||!d||typeof ow.computeVat!=='function')throw new Error('Il simulatore non è ancora pronto.');const calc=ow.computeVat(d),months=Math.max(1,Number(val(d,'months'))||1),rows=[];const swBox=d.querySelector('[data-vat-key="software"]'),swRate=Math.max(0,Number(swBox?.querySelector('.vat-rate')?.value)||22),swNet=Math.max(0,Number(calc.fullSw?.net)||0),targetLabel=d.getElementById('targetPlan')?.selectedOptions?.[0]?.textContent?.split('·')[0]?.trim()||'Software / SaaS';if(swNet>0)rows.push({description:targetLabel,quantity:1,unit_price:swNet/months,price_type:'monthly',months,line_total:swNet,vat_rate:swRate,group:'software',eligible_amount:Number(calc.eligSw?.net)||0,source_category:'software'});const svcBox=d.querySelector('[data-vat-key="service"]'),svcRate=Math.max(0,Number(svcBox?.querySelector('.vat-rate')?.value)||22),svcNet=Math.max(0,Number(calc.svc?.net)||0),packageLabel=d.getElementById('package')?.selectedOptions?.[0]?.textContent?.trim()||'Servizi Metallufficio';if(svcNet>0)rows.push({description:packageLabel,quantity:1,unit_price:svcNet,price_type:'one_off',months:null,line_total:svcNet,vat_rate:svcRate,group:'services',eligible_amount:Number(calc.groups?.consulting?.net||0)+Number(calc.groups?.training?.net||0),source_category:'service'});d.querySelectorAll('.extra-row').forEach((r,i)=>{const raw=Math.max(0,Number(r.querySelector('.amount')?.value)||0);if(!raw)return;const mode=r.querySelector('.vat-mode-extra')?.value||'net',rate=Math.max(0,Number(r.querySelector('.vat-rate-extra')?.value)||22),s=split(ow,raw,mode,rate),etype=r.querySelector('.etype')?.value||'outside',desc=r.querySelector('.desc')?.value?.trim()||r.querySelector('input[type="text"]')?.value?.trim()||`Voce aggiuntiva ${i+1}`,group=etype==='tech'?'software':['consulting','training'].includes(etype)?'services':'other';rows.push({description:desc,quantity:1,unit_price:Number(s.net)||0,price_type:'one_off',months:null,line_total:Number(s.net)||0,vat_rate:rate,group,eligible_amount:etype==='outside'?0:Number(s.net)||0,source_category:etype})});const sum=rows.reduce((a,r)=>a+Number(r.line_total||0),0),commercialNet=Math.max(0,Number(calc.commercialNet)||0);if(Math.abs(commercialNet-sum)>.01)rows.push({description:'Altre componenti della fornitura',quantity:1,unit_price:Math.max(0,commercialNet-sum),price_type:'one_off',months:null,line_total:Math.max(0,commercialNet-sum),vat_rate:22,group:'other',eligible_amount:0,source_category:'balance'});const payload={type:'mq-bando-quote',bando:'cciaa',client:{business_name:val(d,'clientName'),legal_name:val(d,'clientName'),legal_city:val(d,'clientCity'),legal_province:val(d,'clientProvince')},projectDescription:d.getElementById('sheetDescription')?.textContent?.trim()||'',rows,summary:{commercialNet,commercialVat:Number(calc.commercialVat)||0,commercialGross:Number(calc.commercialGross)||0,eligible:Number(calc.eligible)||0,voucher:Number(calc.voucher)||0,residual:Number(calc.residual)||0}};if(!rows.length)throw new Error('Inserisci almeno una voce economica nella simulazione.');window.parent.postMessage(payload,TARGET);toast('Simulazione inviata al preventivo.')}catch(e){console.error(e);toast(e.message||String(e))}}
document.getElementById('send').onclick=build;
</script></body></html>
