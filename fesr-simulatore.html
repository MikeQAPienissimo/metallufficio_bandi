<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulatore FESR 1.2.2 · Metallufficio</title>
<style>
:root{--line:#e4e8ed;--body:"Aptos","Segoe UI",Arial,sans-serif;--grad:linear-gradient(90deg,#E22B9C 0%,#D42CA4 12.5%,#AE2DA9 25%,#7C31AB 37.5%,#563DAE 50%,#3852B5 62.5%,#1A76BC 75%,#069BC3 87.5%,#02B3CA 100%)}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#fff;font-family:var(--body)}.header{position:sticky;top:0;z-index:20;height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 max(16px,calc((100vw - 1180px)/2));border-bottom:1px solid var(--line);background:rgba(255,255,255,.97);backdrop-filter:blur(14px)}.brand img{display:block;width:255px;height:56px;object-fit:contain;object-position:left center}.actions{display:flex;gap:8px;align-items:center}.back,.docbtn{border:1px solid var(--line);border-radius:13px;padding:10px 13px;text-decoration:none;color:#111318;font-weight:900;font-size:.78rem;background:#fff;cursor:pointer}.docbtn{border:0;color:#fff;background:var(--grad)}.frame{display:block;width:100%;min-height:1100px;border:0;background:#fff}.embedded .frame{min-height:700px}@media(max-width:700px){.header{height:68px;padding:0 12px}.brand img{width:175px;height:44px}.back,.docbtn{padding:9px 10px;font-size:.7rem}.actions{gap:5px}}@media(max-width:470px){.back{display:none}}
</style>
</head>
<body>
<header class="header"><a class="brand" href="index.html" aria-label="Torna alla homepage"><img src="https://metallufficio-ristorazione.mikevast.chatgpt.site/logo-metallufficio.jpeg" alt="Metallufficio"></a><div class="actions"><button class="docbtn" id="printFesr" type="button">Stampa dati candidatura</button><a class="back" href="simulatore.html">← Scegli bando</a></div></header>
<iframe id="sim" class="frame" src="fesr-simulatore-base.html" title="Simulatore FESR Metallufficio"></iframe>
<script>
if(window.self!==window.top)document.body.classList.add('embedded');
const sim=document.getElementById('sim');
const GEO_URL='https://raw.githubusercontent.com/matteocontrini/comuni-json/master/comuni.json';
const REGIONI=['Abruzzo','Basilicata','Calabria','Campania','Emilia-Romagna','Friuli-Venezia Giulia','Lazio','Liguria','Lombardia','Marche','Molise','Piemonte','Puglia','Sardegna','Sicilia','Toscana','Trentino-Alto Adige/Südtirol','Umbria','Valle d\'Aosta/Vallée d\'Aoste','Veneto'];
let geo=[],locationReady=false,vatReady=false,vatObserver=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const money=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(n)||0);
function normalizeComune(c){return {nome:c.nome||c.comune||'',regione:typeof c.regione==='string'?c.regione:(c.regione?.nome||''),provincia:typeof c.provincia==='string'?c.provincia:(c.provincia?.nome||''),sigla:c.sigla||c.provincia?.sigla||c.siglaProvincia||''}}
async function loadGeo(){if(geo.length)return geo;try{const r=await fetch(GEO_URL,{cache:'force-cache'});if(!r.ok)throw new Error('geo');geo=(await r.json()).map(normalizeComune).filter(x=>x.nome&&x.regione);return geo}catch(e){return []}}
function emit(el){el?.dispatchEvent(new Event('input',{bubbles:true}));el?.dispatchEvent(new Event('change',{bubbles:true}))}
async function setupLocation(d){
 if(locationReady||!d.getElementById('comune'))return;locationReady=true;const city=d.getElementById('comune'),field=city.closest('.field'),grid=field?.parentElement;if(!field||!grid)return;city.setAttribute('list','comuniAbruzzo');city.placeholder='Inizia a scrivere il Comune';let dl=d.getElementById('comuniAbruzzo');if(!dl){dl=d.createElement('datalist');dl.id='comuniAbruzzo';field.appendChild(dl)}
 const rf=d.createElement('div');rf.className='field';rf.innerHTML='<label for="regioneProgetto">Regione sede/unità progetto</label><select id="regioneProgetto">'+REGIONI.map(r=>'<option'+(r==='Abruzzo'?' selected':'')+'>'+esc(r)+'</option>').join('')+'</select><small>Selezioniamo prima la Regione.</small>';
 const pf=d.createElement('div');pf.className='field';pf.innerHTML='<label for="provinciaProgetto">Provincia</label><select id="provinciaProgetto"><option value="">Caricamento...</option></select><small>Il Comune viene filtrato sulla Provincia.</small>';grid.insertBefore(rf,field);grid.insertBefore(pf,field);const region=rf.querySelector('select'),prov=pf.querySelector('select'),data=await loadGeo();
 function fillCities(){const pv=prov.value,rr=region.value,pname=prov.options[prov.selectedIndex]?.dataset.name||'';const rows=data.filter(x=>x.regione===rr&&(!pv||x.sigla===pv||x.provincia===pname));dl.innerHTML=rows.sort((a,b)=>a.nome.localeCompare(b.nome,'it')).map(x=>'<option value="'+esc(x.nome)+'"></option>').join('');city.placeholder=rows.length?'Scrivi per cercare tra '+rows.length+' Comuni':'Scrivi il Comune manualmente'}
 function syncAbruzzo(){const a=d.getElementById('abruzzo');if(a){a.value=region.value==='Abruzzo'?'yes':'no';emit(a)}}
 function fillProv(){const rows=data.filter(x=>x.regione===region.value),mp=new Map();rows.forEach(x=>{if(x.provincia)mp.set(x.sigla||x.provincia,{name:x.provincia,sigla:x.sigla})});prov.innerHTML='<option value="">Seleziona Provincia</option>'+[...mp.values()].sort((a,b)=>a.name.localeCompare(b.name,'it')).map(x=>'<option value="'+esc(x.sigla||x.name)+'" data-name="'+esc(x.name)+'">'+esc(x.name)+(x.sigla?' ('+esc(x.sigla)+')':'')+'</option>').join('');if(region.value==='Abruzzo'&&!rows.length)prov.innerHTML='<option value="">Seleziona Provincia</option><option value="AQ">L\'Aquila (AQ)</option><option value="CH">Chieti (CH)</option><option value="PE">Pescara (PE)</option><option value="TE">Teramo (TE)</option>';city.value='';fillCities();syncAbruzzo()}
 region.addEventListener('change',fillProv);prov.addEventListener('change',()=>{city.value='';fillCities();syncAbruzzo();emit(city)});fillProv();
}
function vatSplit(amount,mode,rate){amount=Math.max(0,Number(amount)||0);rate=Math.max(0,Number(rate)||0)/100;if(mode==='gross'&&rate>0){const net=amount/(1+rate);return{net,vat:amount-net,gross:amount}}const net=amount,vat=net*rate;return{net,vat,gross:net+vat}}
function setupVat(d){
 if(vatReady||!d.getElementById('cliente'))return;vatReady=true;const style=d.createElement('style');style.textContent='.vat-global{margin-top:12px;border:1px solid #e0e4e9;border-radius:15px;padding:12px;background:#fafbfc}.vat-global h4{font-family:"Arial Black",Arial,sans-serif;margin:0 0 5px;font-size:.82rem}.vat-global p{margin:0 0 8px;color:#68707b;font-size:.68rem}.vat-global-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.vat-rule{border-radius:10px;background:#edf5fb;padding:9px;color:#285d78;font-size:.67rem}.vat-row{grid-column:1/-1;border-top:1px dashed #dce1e6;padding-top:8px;display:grid;grid-template-columns:1fr 100px auto;gap:8px;align-items:end}.vat-row label{display:grid;gap:3px;color:#626a75;font-size:.6rem;font-weight:850}.vat-row select,.vat-row input{width:100%;border:1px solid #d5dae0;border-radius:8px;padding:6px;background:#fff}.vat-row .vat-values{font-size:.62rem;color:#65707a;white-space:nowrap}.vat-side-summary{margin-top:8px;border-radius:11px;background:#f3f6f9;padding:9px;font-size:.66rem;color:#5b6570}@media(max-width:650px){.vat-global-grid,.vat-row{grid-template-columns:1fr}.vat-row .vat-values{white-space:normal}}';d.head.appendChild(style);
 const card=d.getElementById('cliente')?.closest('.card-body');if(card){const p=d.createElement('div');p.className='vat-global';p.innerHTML='<h4>Trattamento IVA del cliente</h4><p>L’Avviso esclude l’IVA, salvo il caso in cui risulti indetraibile. Questa scelta vale per la base agevolabile.</p><div class="vat-global-grid"><div class="field"><label>IVA recuperabile / detraibile dal cliente?</label><select id="vatRecoverableFesr"><option value="yes" selected>Sì · IVA NON agevolabile</option><option value="no">No · IVA potenzialmente agevolabile</option></select></div><div id="vatRuleFesr" class="vat-rule">Il contributo viene calcolato sull’imponibile.</div></div>';card.appendChild(p);p.querySelector('select').addEventListener('change',vatUpdate)}ensureVatRows(d);if(vatObserver)vatObserver.disconnect();const items=d.getElementById('items');if(items){vatObserver=new MutationObserver(()=>{ensureVatRows(d);setTimeout(vatUpdate,0)});vatObserver.observe(items,{childList:true,subtree:true})}['rate','mesi','deminimis','indirect'].forEach(id=>d.getElementById(id)?.addEventListener('input',()=>setTimeout(vatUpdate,0)));vatUpdate();
}
function ensureVatRows(d){d.querySelectorAll('.item').forEach(r=>{if(r.querySelector('.vat-row'))return;const box=d.createElement('div');box.className='vat-row';box.innerHTML='<label>Prezzo inserito<select class="vat-mode"><option value="net">IVA esclusa</option><option value="gross">IVA inclusa</option></select></label><label>IVA %<input class="vat-rate" type="number" min="0" max="100" step="1" value="22"></label><div class="vat-values">Imponibile / IVA / lordo</div>';r.appendChild(box);box.querySelectorAll('select,input').forEach(x=>x.addEventListener('input',vatUpdate));r.querySelectorAll('.i-price,.i-months,.i-pay,.i-cat,.i-status').forEach(x=>x.addEventListener('input',()=>setTimeout(vatUpdate,0)))})}
function fesrVatCalc(d){
 const recoverable=d.getElementById('vatRecoverableFesr')?.value!=='no',projectMonths=Math.max(1,Number(d.getElementById('mesi')?.value)||1),rate=Math.max(0,Number(d.getElementById('rate')?.value)||0)/100,deminimisLeft=Math.max(0,300000-(Number(d.getElementById('deminimis')?.value)||0));let commercialNet=0,commercialVat=0,directNet=0,directVat=0,abcBase=0;const lines=[];
 d.querySelectorAll('.item').forEach(r=>{const price=Math.max(0,Number(r.querySelector('.i-price')?.value)||0),months=Math.max(1,Number(r.querySelector('.i-months')?.value)||1),pay=r.querySelector('.i-pay')?.value||'once',cat=r.querySelector('.i-cat')?.value||'X',status=r.querySelector('.i-status')?.value||'exclude',mode=r.querySelector('.vat-mode')?.value||'net',vr=Number(r.querySelector('.vat-rate')?.value)||0,unit=vatSplit(price,mode,vr),commercialFactor=pay==='monthly'?months:1,eligibleFactor=(cat==='B'&&pay==='monthly')?Math.min(months,projectMonths):commercialFactor,eligibleRow=!['X','S'].includes(cat)&&['include','warn'].includes(status);commercialNet+=unit.net*commercialFactor;commercialVat+=unit.vat*commercialFactor;const lineNet=eligibleRow?unit.net*eligibleFactor:0,lineVat=eligibleRow?unit.vat*eligibleFactor:0;directNet+=lineNet;directVat+=lineVat;if(eligibleRow&&['A','B','C'].includes(cat))abcBase+=lineNet+(recoverable?0:lineVat);const gross=unit.gross*commercialFactor,desc=r.querySelector('.i-desc')?.value?.trim()||'Voce progetto';lines.push({desc,net:unit.net*commercialFactor,vat:unit.vat*commercialFactor,gross,eligible:lineNet+(recoverable?0:lineVat)});const values=r.querySelector('.vat-values');if(values)values.textContent='Imponibile '+money(unit.net*commercialFactor)+' · IVA '+money(unit.vat*commercialFactor)+' · Lordo '+money(gross)});
 const directEligible=directNet+(recoverable?0:directVat),indirect=d.getElementById('indirect')?.checked?abcBase*.05:0,eligible=directEligible+indirect,commercialGross=commercialNet+commercialVat,grant=Math.min(eligible*rate,100000,deminimisLeft),residual=Math.max(0,commercialGross-grant);return{recoverable,commercialNet,commercialVat,commercialGross,directNet,directVat,directEligible,indirect,eligible,grant,residual,lines};
}
function vatUpdate(){const d=sim.contentDocument;if(!d||!d.getElementById('vatRecoverableFesr'))return;ensureVatRows(d);const c=fesrVatCalc(d),set=(id,v)=>{const n=d.getElementById(id);if(n)n.textContent=v};set('totalCommercial',money(c.commercialGross));set('eligibleSpend',money(c.eligible));set('grant',money(c.grant));set('clientShare',money(c.residual));set('recapTotal',money(c.commercialGross));set('recapEligible',money(c.eligible));set('recapGrant',money(c.grant));const rule=d.getElementById('vatRuleFesr');if(rule)rule.textContent=c.recoverable?'IVA recuperabile: spesa agevolabile calcolata sull’imponibile.':'IVA indetraibile: l’IVA viene inclusa nella spesa potenzialmente ammissibile, da documentare.';const th=d.getElementById('totalCommercialHint');if(th)th.textContent='imponibile '+money(c.commercialNet)+' + IVA '+money(c.commercialVat);const eh=d.getElementById('eligibleHint');if(eh)eh.textContent=(c.recoverable?'IVA esclusa':'IVA indetraibile inclusa')+(c.indirect?' · + '+money(c.indirect)+' costi indiretti':'');let info=d.getElementById('vatFesrSummary'),side=d.querySelector('.summary');if(!info&&side){info=d.createElement('div');info.id='vatFesrSummary';info.className='vat-side-summary';side.appendChild(info)}if(info)info.innerHTML='<b>IVA progetto:</b> imponibile '+money(c.commercialNet)+' · IVA '+money(c.commercialVat)+' · lordo '+money(c.commercialGross)+'<br><b>Base FESR:</b> '+money(c.directNet)+(c.recoverable?' (IVA esclusa)':' + IVA indetraibile '+money(c.directVat))+(c.indirect?' + indiretti '+money(c.indirect):'')+' = <b>'+money(c.eligible)+'</b>';setTimeout(resize,0)}
function resize(){try{const d=sim.contentDocument;if(!d)return;const h=Math.max(760,d.documentElement.scrollHeight,d.body.scrollHeight);sim.style.height=h+'px'}catch(e){}}
function buildFesrPrint(){
 const d=sim.contentDocument;if(!d)return,c=fesrVatCalc(d),text=id=>d.getElementById(id)?.textContent?.trim()||'',value=id=>d.getElementById(id)?.value||'',cliente=value('cliente')||'DA COMPLETARE',comune=value('comune')||'DA COMPLETARE',regione=value('regioneProgetto')||'Abruzzo',provincia=value('provinciaProgetto')||'DA COMPLETARE',needs=[...d.querySelectorAll('#needs input:checked')].map(i=>i.closest('label')?.querySelector('b')?.textContent?.trim()).filter(Boolean),recap=value('recapText')||'Bozza progetto non ancora generata.',rate=value('rate')||'—',duration=value('mesi')||'—',deminimis=value('deminimis')||'0',pre=text('pPre')||text('sidePre')||'—',merit=text('pMerit')||text('sideMerit')||'—',area=text('areaResult')||'—',art=value('artigiana')==='yes'?'Sì':'No',esg=value('esg')==='yes'?'Sì':value('esg')==='check'?'Da verificare':'No';const w=window.open('','_blank');if(!w){alert('Il browser ha bloccato la finestra di stampa. Consenti i popup per questo sito.');return}w.document.write(`<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Dati candidatura FESR · ${esc(cliente)}</title><style>@page{size:A4;margin:13mm}*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#111;font-size:10.3pt;line-height:1.35;margin:0}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:14px}.top img{width:190px}.draft{font-weight:800;color:#9a5f00;font-size:9pt;text-align:right}.title{text-align:center;margin:18px 0}.title h1{font-size:18pt;margin:0}.box{border:1px solid #555;padding:10px;margin:9px 0;break-inside:avoid}.box h2{font-size:10pt;margin:0 0 7px;text-transform:uppercase}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cell{border:1px solid #bbb;padding:8px}.cell b{display:block;font-size:8pt;text-transform:uppercase;color:#666;margin-bottom:3px}.value{white-space:pre-wrap}.small{font-size:8.5pt;color:#555}.iva{background:#fff8e8;padding:8px;border-radius:6px;margin-top:7px}</style></head><body><div class="top"><img src="https://metallufficio-ristorazione.mikevast.chatgpt.site/logo-metallufficio.jpeg"><div class="draft">BOZZA DATI CANDIDATURA FESR<br>uso interno · da verificare sul facsimile ufficiale</div></div><div class="title">PR ABRUZZO FESR 2021–2027 · AZIONE 1.2.2<h1>Digitalizzazione delle PMI</h1></div><div class="box"><h2>Beneficiario e localizzazione</h2><div class="grid"><div class="cell"><b>Cliente</b>${esc(cliente)}</div><div class="cell"><b>Sede/unità progetto</b>${esc(comune)} · ${esc(provincia)} · ${esc(regione)}</div><div class="cell"><b>Durata progetto</b>${esc(duration)} mesi</div><div class="cell"><b>De minimis indicati</b>€ ${esc(deminimis)}</div></div></div><div class="box"><h2>Processi / obiettivi digitali</h2>${needs.length?'<ul>'+needs.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'Nessun obiettivo selezionato.'}</div><div class="box"><h2>Descrizione / recap</h2><div class="value">${esc(recap)}</div></div><div class="box"><h2>Quadro economico indicativo</h2><div class="grid"><div class="cell"><b>Imponibile commerciale</b>${money(c.commercialNet)}</div><div class="cell"><b>IVA complessiva</b>${money(c.commercialVat)}</div><div class="cell"><b>Totale commerciale lordo</b>${money(c.commercialGross)}</div><div class="cell"><b>Spesa potenzialmente ammissibile</b>${money(c.eligible)}</div><div class="cell"><b>Intensità simulata</b>${esc(rate)}%</div><div class="cell"><b>Contributo teorico</b>${money(c.grant)}</div></div><div class="iva"><b>Trattamento IVA beneficiario:</b> ${c.recoverable?'IVA recuperabile/detraibile → esclusa dalla spesa ammissibile.':'IVA non recuperabile/indetraibile → inclusa nella spesa potenzialmente ammissibile, da documentare.'}</div></div><div class="box"><h2>Premialità e scoring interno</h2><div class="grid"><div class="cell"><b>Impresa artigiana</b>${art}</div><div class="cell"><b>ESG / ambientale</b>${esg}</div><div class="cell"><b>Area Interna</b>${esc(area)}</div><div class="cell"><b>Punteggio preliminare</b>${esc(pre)}</div><div class="cell"><b>Merito stimato</b>${esc(merit)}</div></div></div><p class="small">Questa stampa organizza i dati inseriti nel simulatore. Non sostituisce il facsimile ufficiale, le dichiarazioni e le verifiche richieste dall’Avviso.</p><script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script></body></html>`);w.document.close()}
function tune(){try{const d=sim.contentDocument;if(!d)return;d.documentElement.style.overflowX='hidden';const goHome=e=>{e.preventDefault();e.stopPropagation();top.location.href='index.html'};d.querySelectorAll('.brand,.brand img,.footer img,img[alt*="Metallufficio" i]').forEach(n=>{n.style.cursor='pointer';n.addEventListener('click',goHome,true)});setupLocation(d);setupVat(d);setTimeout(vatUpdate,60);setTimeout(resize,80);setTimeout(resize,300);setTimeout(resize,900);try{new ResizeObserver(()=>{resize();vatUpdate()}).observe(d.body)}catch(e){}}catch(e){}}
document.getElementById('printFesr').addEventListener('click',buildFesrPrint);sim.addEventListener('load',()=>{locationReady=false;vatReady=false;tune()});
</script>
</body>
</html>
