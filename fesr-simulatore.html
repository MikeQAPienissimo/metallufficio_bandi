<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulatore FESR 1.2.2 · Metallufficio</title>
<style>
:root{--line:#e4e8ed;--body:"Aptos","Segoe UI",Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#fff;font-family:var(--body)}.header{height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 max(16px,calc((100vw - 1180px)/2));border-bottom:1px solid var(--line);background:#fff}.brand img{display:block;width:255px;height:56px;object-fit:contain;object-position:left center}.back{border:1px solid var(--line);border-radius:13px;padding:10px 13px;text-decoration:none;color:#111318;font-weight:900;font-size:.78rem}.frame{display:block;width:100%;min-height:1100px;border:0;background:#fff}.embedded .header{display:none}.embedded .frame{min-height:700px}@media(max-width:700px){.header{height:68px;padding:0 12px}.brand img{width:190px;height:46px}.back{padding:9px 10px;font-size:.72rem}}
</style>
</head>
<body>
<header class="header"><a class="brand" href="index.html" aria-label="Torna alla homepage"><img src="https://metallufficio-ristorazione.mikevast.chatgpt.site/logo-metallufficio.jpeg" alt="Metallufficio"></a><a class="back" href="simulatore.html">← Scegli bando</a></header>
<iframe id="sim" class="frame" src="fesr-simulatore-base.html" title="Simulatore FESR Metallufficio"></iframe>
<script>
if(window.self!==window.top)document.body.classList.add('embedded');
const sim=document.getElementById('sim');
function resize(){try{const d=sim.contentDocument;if(!d)return;const h=Math.max(760,d.documentElement.scrollHeight,d.body.scrollHeight);sim.style.height=h+'px'}catch(e){}}
function tune(){try{const d=sim.contentDocument;if(!d)return;d.documentElement.style.overflowX='hidden';const goHome=e=>{e.preventDefault();e.stopPropagation();top.location.href='index.html'};d.querySelectorAll('.brand,.brand img,.footer img,img[alt*="Metallufficio" i]').forEach(n=>{n.style.cursor='pointer';n.addEventListener('click',goHome,true)});setTimeout(resize,40);setTimeout(resize,250);setTimeout(resize,800);try{new ResizeObserver(resize).observe(d.body)}catch(e){}}catch(e){}}
sim.addEventListener('load',tune);
</script>
</body>
</html>
