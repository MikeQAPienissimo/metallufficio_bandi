<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulatore FESR 1.2.2 · Metallufficio</title>
<style>
:root{--line:#e4e8ed;--body:"Aptos","Segoe UI",Arial,sans-serif;--grad:linear-gradient(90deg,#E22B9C 0%,#D42CA4 12.5%,#AE2DA9 25%,#7C31AB 37.5%,#563DAE 50%,#3852B5 62.5%,#1A76BC 75%,#069BC3 87.5%,#02B3CA 100%)}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#fff;font-family:var(--body)}.header{position:sticky;top:0;z-index:20;height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 max(16px,calc((100vw - 1180px)/2));border-bottom:1px solid var(--line);background:rgba(255,255,255,.97);backdrop-filter:blur(14px)}.brand img{display:block;width:255px;height:56px;object-fit:contain;object-position:left center}.actions{display:flex;gap:8px;align-items:center}.back,.docbtn{border:1px solid var(--line);border-radius:13px;padding:10px 13px;text-decoration:none;color:#111318;font-weight:900;font-size:.78rem;background:#fff;cursor:pointer}.docbtn{border:0;color:#fff;background:var(--grad)}.frame{display:block;width:100%;min-height:1100px;border:0;background:#fff}.embedded .frame{min-height:700px}@media(max-width:700px){.header{height:68px;padding:0 12px}.brand img{width:175px;height:44px}.back,.docbtn{padding:9px 10px;font-size:.7rem}.actions{gap:5px}}@media(max-width:470px){.back{display:none}}
</style>
</head>
<body>
<header class="header"><a class="brand" href="index.html" aria-label="Torna alla homepage"><img src="https://metallufficio-ristorazione.mikevast.chatgpt.site/logo-metallufficio.jpeg" alt="Metallufficio"></a><div class="actions"><button class="docbtn" id="printFesr" type="button">Stampa dati candidatura</button><a class="back" href="simulatore.html">← Scegli bando</a></div></header>
<iframe id="sim" class="frame" src="fesr-simulatore-base.html" title="Simulatore FESR Metallufficio"></iframe>
<script>
if(window.self!==window.top)document.body.classList.add('embedded');
const sim=document.getElementById('sim');
const GEO_URL='https://raw.githubusercontent.com/matteocontrini/comuni-json/master/comuni.json';
const REGIONI=['Abruzzo','Basilicata','Calabria','Campania','Emilia-Romagna','Friuli-Venezia Giulia','Lazio','Liguria','Lombardia','Marche','Molise','Piemonte','Puglia','Sardegna','Sicilia','Toscana','Trentino-Alto Adige/Südtirol','Umbria','Valle d\'Aosta/Vallée d\'Aoste','Veneto'];
let geo=[],locationReady=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function normalizeComune(c){return {nome:c.nome||c.comune||'',regione:typeof c.regione==='string'?c.regione:(c.regione?.nome||''),provincia:typeof c.provincia==='string'?c.provincia:(c.provincia?.nome||''),sigla:c.sigla||c.provincia?.sigla||c.siglaProvincia||''}}
async function loadGeo(){if(geo.length)return geo;try{const r=await fetch(GEO_URL,{cache:'force-cache'});if(!r.ok)throw new Error('geo');geo=(await r.json()).map(normalizeComune).filter(x=>x.nome&&x.regione);return geo}catch(e){return []}}
function emit(el){el?.dispatchEvent(new Event('input',{bubbles:true}));el?.dispatchEvent(new Event('change',{bubbles:true}))}
async function setupLocation(d){
  if(locationReady||!d.getElementById('comune'))return;locationReady=true;
  const city=d.getElementById('comune');const field=city.closest('.field');const grid=field?.parentElement;if(!field||!grid)return;
  city.setAttribute('list','comuniAbruzzo');city.placeholder='Inizia a scrivere il Comune';let dl=d.getElementById('comuniAbruzzo');if(!dl){dl=d.createElement('datalist');dl.id='comuniAbruzzo';field.appendChild(dl)}
  const rf=d.createElement('div');rf.className='field';rf.innerHTML='<label for="regioneProgetto">Regione sede/unità progetto</label><select id="regioneProgetto">'+REGIONI.map(r=>'<option'+(r==='Abruzzo'?' selected':'')+'>'+esc(r)+'</option>').join('')+'</select><small>Selezioniamo prima la Regione.</small>';
  const pf=d.createElement('div');pf.className='field';pf.innerHTML='<label for="provinciaProgetto">Provincia</label><select id="provinciaProgetto"><option value="">Caricamento...</option></select><small>Il Comune viene filtrato sulla Provincia.</small>';
  grid.insertBefore(rf,field);grid.insertBefore(pf,field);const region=rf.querySelector('select'),prov=pf.querySelector('select');const data=await loadGeo();
  function fillProv(){const rows=data.filter(x=>x.regione===region.value);const mp=new Map();rows.forEach(x=>{if(x.provincia)mp.set(x.sigla||x.provincia,{name:x.provincia,sigla:x.sigla})});prov.innerHTML='<option value="">Seleziona Provincia</option>'+[...mp.values()].sort((a,b)=>a.name.localeCompare(b.name,'it')).map(x=>'<option value="'+esc(x.sigla||x.name)+'" data-name="'+esc(x.name)+'">'+esc(x.name)+(x.sigla?' ('+esc(x.sigla)+')':'')+'</option>').join('');if(region.value==='Abruzzo'&&!rows.length)prov.innerHTML='<option value="">Seleziona Provincia</option><option value="AQ">L\'Aquila (AQ)</option><option value="CH">Chieti (CH)</option><option value="PE">Pescara (PE)</option><option value="TE">Teramo (TE)</option>';city.value='';fillCities();syncAbruzzo()}
  function fillCities(){const pv=prov.value,rr=region.value,pname=prov.options[prov.selectedIndex]?.dataset.name;const rows=data.filter(x=>x.regione===rr&&(!pv||x.sigla===pv||x.provincia===pname));dl.innerHTML=rows.sort((a,b)=>a.nome.localeCompare(b.nome,'it')).map(x=>'<option value="'+esc(x.nome)+'"></option>').join('');city.placeholder=rows.length?'Scrivi per cercare tra '+rows.length+' Comuni':'Scrivi il Comune manualmente'}
  function syncAbruzzo(){const a=d.getElementById('abruzzo');if(a){a.value=region.value==='Abruzzo'?'yes':'no';emit(a)}}
  region.addEventListener('change',fillProv);prov.addEventListener('change',()=>{city.value='';fillCities();syncAbruzzo();emit(city)});fillProv();
}
function resize(){try{const d=sim.contentDocument;if(!d)return;const h=Math.max(760,d.documentElement.scrollHeight,d.body.scrollHeight);sim.style.height=h+'px'}catch(e){}}
function buildFesrPrint(){
  const d=sim.contentDocument;if(!d)return;const text=id=>d.getElementById(id)?.textContent?.trim()||'';const value=id=>d.getElementById(id)?.value||'';const cliente=value('cliente')||'DA COMPLETARE';const comune=value('comune')||'DA COMPLETARE';const regione=value('regioneProgetto')||'Abruzzo';const provincia=value('provinciaProgetto')||'DA COMPLETARE';const needs=[...d.querySelectorAll('#needs input:checked')].map(i=>i.closest('label')?.querySelector('b')?.textContent?.trim()).filter(Boolean);const recap=value('recapText')||'Bozza progetto non ancora generata.';const total=text('totalCommercial')||text('recapTotal')||'€ 0';const eligible=text('eligibleSpend')||text('recapEligible')||'€ 0';const grant=text('grant')||text('recapGrant')||'€ 0';const rate=value('rate')||'—';const duration=value('mesi')||'—';const deminimis=value('deminimis')||'0';const pre=text('pPre')||text('sidePre')||'—';const merit=text('pMerit')||text('sideMerit')||'—';const area=text('areaResult')||'—';const art=value('artigiana')==='yes'?'Sì':'No';const esg=value('esg')==='yes'?'Sì':value('esg')==='check'?'Da verificare':'No';const costs=[...d.querySelectorAll('#costList .cost-line')].map(x=>x.textContent.trim()).filter(Boolean);const w=window.open('','_blank');if(!w){alert('Il browser ha bloccato la finestra di stampa. Consenti i popup per questo sito.');return}w.document.write(`<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Dati candidatura FESR · ${esc(cliente)}</title><style>@page{size:A4;margin:13mm}*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#111;font-size:10.5pt;line-height:1.35;margin:0}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:14px}.top img{width:190px}.draft{font-weight:800;color:#9a5f00;font-size:9pt;text-align:right}.title{text-align:center;margin:18px 0}.title h1{font-size:18pt;margin:0}.box{border:1px solid #555;padding:10px;margin:9px 0;break-inside:avoid}.box h2{font-size:10pt;margin:0 0 7px;text-transform:uppercase}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cell{border:1px solid #bbb;padding:8px}.cell b{display:block;font-size:8pt;text-transform:uppercase;color:#666;margin-bottom:3px}.value{white-space:pre-wrap}.costs{margin:0;padding-left:18px}.small{font-size:8.5pt;color:#555}.warn{color:#8b5e00;font-weight:700}</style></head><body><div class="top"><img src="https://metallufficio-ristorazione.mikevast.chatgpt.site/logo-metallufficio.jpeg"><div class="draft">BOZZA DATI CANDIDATURA FESR<br>uso interno · da riportare/verificare sul facsimile ufficiale</div></div><div class="title"><div>PR ABRUZZO FESR 2021–2027 · AZIONE 1.2.2</div><h1>Digitalizzazione delle PMI</h1></div><div class="box"><h2>Beneficiario e localizzazione</h2><div class="grid"><div class="cell"><b>Cliente</b>${esc(cliente)}</div><div class="cell"><b>Sede/unità progetto</b>${esc(comune)} · ${esc(provincia)} · ${esc(regione)}</div><div class="cell"><b>Durata progetto</b>${esc(duration)} mesi</div><div class="cell"><b>De minimis già indicati</b>€ ${esc(deminimis)}</div></div></div><div class="box"><h2>Processi / obiettivi digitali selezionati</h2>${needs.length?'<ul>'+needs.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<span class="warn">Nessun obiettivo selezionato.</span>'}</div><div class="box"><h2>Descrizione / recap generato dal simulatore</h2><div class="value">${esc(recap)}</div></div><div class="box"><h2>Quadro economico indicativo</h2><div class="grid"><div class="cell"><b>Investimento commerciale</b>${esc(total)}</div><div class="cell"><b>Spesa potenzialmente ammissibile</b>${esc(eligible)}</div><div class="cell"><b>Intensità richiesta simulata</b>${esc(rate)}%</div><div class="cell"><b>Contributo teorico</b>${esc(grant)}</div></div>${costs.length?'<h3 style="font-size:9pt;margin:10px 0 5px">Voci di prezzo</h3><ul class="costs">'+costs.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':''}</div><div class="box"><h2>Premialità e scoring interno</h2><div class="grid"><div class="cell"><b>Impresa artigiana</b>${art}</div><div class="cell"><b>ESG / ambientale</b>${esg}</div><div class="cell"><b>Area Interna</b>${esc(area)}</div><div class="cell"><b>Punteggio preliminare</b>${esc(pre)}</div><div class="cell"><b>Merito stimato</b>${esc(merit)}</div></div></div><div class="box"><h2>Nota operativa</h2><p class="small">Questa stampa organizza i dati già inseriti nel simulatore. Non è il facsimile ufficiale della Regione e non sostituisce dichiarazioni, allegati, firma digitale o verifiche richieste dall’Avviso.</p></div><script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script></body></html>`);w.document.close()}
function tune(){try{const d=sim.contentDocument;if(!d)return;d.documentElement.style.overflowX='hidden';const goHome=e=>{e.preventDefault();e.stopPropagation();top.location.href='index.html'};d.querySelectorAll('.brand,.brand img,.footer img,img[alt*="Metallufficio" i]').forEach(n=>{n.style.cursor='pointer';n.addEventListener('click',goHome,true)});setupLocation(d);setTimeout(resize,40);setTimeout(resize,250);setTimeout(resize,800);try{new ResizeObserver(resize).observe(d.body)}catch(e){}}catch(e){}}
document.getElementById('printFesr').addEventListener('click',buildFesrPrint);sim.addEventListener('load',()=>{locationReady=false;tune()});
</script>
</body>
</html>
