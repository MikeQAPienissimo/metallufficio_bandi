<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Metallufficio Quote</title>
<meta name="theme-color" content="#ffffff" />
<link rel="stylesheet" href="./app.css" />
<script src="https://unpkg.com/lucide@0.468.0"></script>
</head>
<body>
<div class="shell">
<aside class="sidebar">
  <div class="brand"><img src="/metallufficio-logo.svg" alt="Metallufficio - Soluzioni per l'innovazione"></div>
  <nav id="nav">
    <button class="nav" data-page="Dashboard"><i data-lucide="gauge"></i><span>Dashboard</span></button>
    <button class="nav" data-page="Clienti"><i data-lucide="users"></i><span>Clienti</span></button>
    <button class="nav" data-page="Preventivi"><i data-lucide="file-text"></i><span>Preventivi</span></button>
    <button class="nav" data-page="Rinnovi"><i data-lucide="calendar-days"></i><span>Rinnovi</span></button>
    <button class="nav" data-page="Catalogo"><i data-lucide="package"></i><span>Catalogo</span></button>
    <button class="nav" data-page="Pacchetti"><i data-lucide="layers-3"></i><span>Pacchetti</span></button>
    <button class="nav" data-page="Import"><i data-lucide="upload"></i><span>Import</span></button>
    <button class="nav" data-page="Simulatori"><i data-lucide="calculator"></i><span>Simulatori</span></button>
    <button class="nav active" data-page="Impostazioni"><i data-lucide="settings"></i><span>Impostazioni</span></button>
  </nav>
  <div class="side-bottom"><div class="product">Metallufficio<br>Quote</div><div class="version">v1.0.0</div></div>
</aside>
<div class="workspace">
<header class="topbar"><div class="search"><i data-lucide="search"></i><input placeholder="Cerca clienti, preventivi, servizi..."><span class="shortcut">⌘ K</span></div><div class="account"><span class="bell"><i data-lucide="bell"></i></span><div class="avatar"><i data-lucide="user-round"></i></div><div class="account-meta"><strong>SuperAdmin</strong><small>admin</small></div><i data-lucide="chevron-down"></i></div></header>
<main id="main"></main>
<footer><span>Metallufficio Quote &nbsp; | &nbsp; Soluzioni per l’innovazione</span><span>Ultimo aggiornamento: 18/06/2025 13:12 &nbsp; | &nbsp; SuperAdmin</span></footer>
<div class="toast" id="toast"><i data-lucide="shield-check"></i><span></span></div>
</div>
</div>
<script src="./app.js"></script>
</body></html>
