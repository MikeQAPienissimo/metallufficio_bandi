<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulatore CCIAA 2026 · Metallufficio</title>
<style>
:root{--line:#e4e8ed;--body:"Aptos","Segoe UI",Arial,sans-serif;--grad:linear-gradient(90deg,#E22B9C 0%,#D42CA4 12.5%,#AE2DA9 25%,#7C31AB 37.5%,#563DAE 50%,#3852B5 62.5%,#1A76BC 75%,#069BC3 87.5%,#02B3CA 100%)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:var(--body)}.header{height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 max(16px,calc((100vw - 1180px)/2));border-bottom:1px solid var(--line);background:#fff}.brand img{display:block;width:255px;height:56px;object-fit:contain;object-position:left center}.actions{display:flex;gap:8px;align-items:center}.back,.docbtn{border:1px solid var(--line);border-radius:13px;padding:10px 13px;text-decoration:none;color:#111318;font-weight:900;font-size:.78rem;background:#fff;cursor:pointer}.docbtn{border:0;color:#fff;background:var(--grad)}.frame{display:block;width:100%;height:calc(100vh - 76px);border:0;background:#fff}@media(max-width:700px){.header{height:68px;padding:0 12px}.brand img{width:175px;height:44px}.frame{height:calc(100vh - 68px)}.back,.docbtn{padding:9px 10px;font-size:.7rem}.actions{gap:5px}}@media(max-width:470px){.back{display:none}}
</style>
</head>
<body>
<header class="header"><a class="brand" href="index.html" aria-label="Torna alla homepage"><img src="https://metallufficio-ristorazione.mikevast.chatgpt.site/logo-metallufficio.jpeg" alt="Metallufficio"></a><div class="actions"><button class="docbtn" id="allegato2" type="button">Stampa Allegato 2</button><a class="back" href="simulatore.html">← Scegli bando</a></div></header>
<iframe id="sim" class="frame" src="simulatore-cciaa-base.html" title="Simulatore CCIAA Metallufficio"></iframe>
<script>
const sim=document.getElementById('sim');
const GEO_URL='https://raw.githubusercontent.com/matteocontrini/comuni-json/master/comuni.json';
const REGIONI=['Abruzzo','Basilicata','Calabria','Campania','Emilia-Romagna','Friuli-Venezia Giulia','Lazio','Liguria','Lombardia','Marche','Molise','Piemonte','Puglia','Sardegna','Sicilia','Toscana','Trentino-Alto Adige/Südtirol','Umbria','Valle d\'Aosta/Vallée d\'Aoste','Veneto'];
let geo=[],tries=0,locationReady=false,vatReady=false,observer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const val=(d,id)=>d.getElementById(id)?.value||'';
const num=(d,id)=>Math.max(0,Number(val(d,id))||0);
const money=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(n)||0);
function normalizeComune(c){return {nome:c.nome||c.comune||'',regione:typeof c.regione==='string'?c.regione:(c.regione?.nome||''),provincia:typeof c.provincia==='string'?c.provincia:(c.provincia?.nome||''),sigla:c.sigla||c.provincia?.sigla||c.siglaProvincia||''}}
async function loadGeo(){if(geo.length)return geo;try{const r=await fetch(GEO_URL,{cache:'force-cache'});if(!r.ok)throw new Error('geo');geo=(await r.json()).map(normalizeComune).filter(x=>x.nome&&x.regione);return geo}catch(e){return []}}
function emit(el){el?.dispatchEvent(new Event('input',{bubbles:true}));el?.dispatchEvent(new Event('change',{bubbles:true}))}
async function setupLocation(d){
 if(locationReady||!d.getElementById('clientCity'))return;locationReady=true;
 const city=d.getElementById('clientCity'),field=city.closest('.field'),grid=field?.parentElement;if(!field||!grid)return;
 city.setAttribute('list','cciaaCities');city.placeholder='Inizia a scrivere il Comune';let dl=d.getElementById('cciaaCities');if(!dl){dl=d.createElement('datalist');dl.id='cciaaCities';field.appendChild(dl)}
 const rf=d.createElement('div');rf.className='field';rf.innerHTML='<label for="clientRegion">Regione</label><select id="clientRegion">'+REGIONI.map(r=>'<option'+(r==='Abruzzo'?' selected':'')+'>'+esc(r)+'</option>').join('')+'</select><small>Prima selezioniamo la Regione.</small>';
 const pf=d.createElement('div');pf.className='field';pf.innerHTML='<label for="clientProvince">Provincia</label><select id="clientProvince"><option value="">Caricamento...</option></select><small>Il Comune viene filtrato sulla Provincia.</small>';
 grid.insertBefore(rf,field);grid.insertBefore(pf,field);const region=rf.querySelector('select'),prov=pf.querySelector('select'),data=await loadGeo();
 function fillCities(){const rr=region.value,pv=prov.value,pname=prov.options[prov.selectedIndex]?.dataset.name||'';const rows=data.filter(x=>x.regione===rr&&(!pv||x.sigla===pv||x.provincia===pname));dl.innerHTML=rows.sort((a,b)=>a.nome.localeCompare(b.nome,'it')).map(x=>'<option value="'+esc(x.nome)+'"></option>').join('');city.placeholder=rows.length?'Scrivi per cercare tra '+rows.length+' Comuni':'Scrivi il Comune manualmente'}
 function syncTerritory(){const t=d.querySelector('[data-check="territory"]');if(t){t.value=(region.value==='Abruzzo'&&['CH','PE'].includes(prov.value))?'yes':'no';emit(t)}}
 function fillProv(){const rr=region.value,rows=data.filter(x=>x.regione===rr),mp=new Map();rows.forEach(x=>{if(x.provincia)mp.set(x.sigla||x.provincia,{name:x.provincia,sigla:x.sigla})});prov.innerHTML='<option value="">Seleziona Provincia</option>'+[...mp.values()].sort((a,b)=>a.name.localeCompare(b.name,'it')).map(x=>'<option value="'+esc(x.sigla||x.name)+'" data-name="'+esc(x.name)+'">'+esc(x.name)+(x.sigla?' ('+esc(x.sigla)+')':'')+'</option>').join('');if(rr==='Abruzzo'&&!rows.length)prov.innerHTML='<option value="">Seleziona Provincia</option><option value="AQ">L\'Aquila (AQ)</option><option value="CH">Chieti (CH)</option><option value="PE">Pescara (PE)</option><option value="TE">Teramo (TE)</option>';city.value='';fillCities();syncTerritory()}
 region.addEventListener('change',fillProv);prov.addEventListener('change',()=>{city.value='';fillCities();syncTerritory();emit(city)});fillProv();
}
function vatSplit(amount,mode,rate){amount=Math.max(0,Number(amount)||0);rate=Math.max(0,Number(rate)||0)/100;if(mode==='gross'&&rate>0){const net=amount/(1+rate);return{net,vat:amount-net,gross:amount}}const net=amount,vat=net*rate;return{net,vat,gross:net+vat}}
function addVatMini(d,parent,key,label){if(parent.querySelector('[data-vat-key="'+key+'"]'))return;const box=d.createElement('div');box.className='vat-mini';box.dataset.vatKey=key;box.innerHTML='<b>'+label+'</b><label>Prezzo inserito<select class="vat-mode"><option value="net">IVA esclusa</option><option value="gross">IVA inclusa</option></select></label><label>IVA %<input class="vat-rate" type="number" min="0" max="100" step="1" value="22"></label>';parent.appendChild(box);box.querySelectorAll('select,input').forEach(x=>x.addEventListener('input',vatUpdate));}
function setupVat(d){
 if(vatReady||!d.getElementById('servicePrice'))return;vatReady=true;
 const style=d.createElement('style');style.textContent='.vat-panel{margin-top:14px;border:1px solid #e0e4e9;border-radius:16px;padding:14px;background:#fafbfc}.vat-panel h4{font-family:"Arial Black",Arial,sans-serif;margin:0 0 7px;font-size:.9rem}.vat-panel p{margin:0 0 10px;color:#666e78;font-size:.75rem}.vat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.vat-mini{margin-top:10px;border:1px dashed #d4d9df;border-radius:13px;padding:10px;display:grid;grid-template-columns:1.2fr 1fr 90px;gap:8px;align-items:end;background:#fff}.vat-mini>b{font-size:.73rem}.vat-mini label{display:grid;gap:4px;font-size:.65rem;font-weight:850;color:#5d6570}.vat-mini select,.vat-mini input{width:100%;border:1px solid #d6dbe1;border-radius:9px;padding:7px;background:#fff}.vat-summary{margin-top:9px;border-radius:12px;padding:10px;background:#eef5fb;color:#285d78;font-size:.73rem}.extra-row .vat-extra{grid-column:1/-1}.vat-extra{display:grid;grid-template-columns:1fr 100px;gap:7px;border-top:1px dashed #e0e4e9;padding-top:7px}.vat-extra label{display:grid;gap:3px;font-size:.62rem;font-weight:850;color:#626a75}.vat-extra select,.vat-extra input{border:1px solid #d6dbe1;border-radius:8px;padding:6px}@media(max-width:700px){.vat-grid,.vat-mini{grid-template-columns:1fr}.vat-extra{grid-template-columns:1fr 1fr}}';d.head.appendChild(style);
 const firstPanel=d.getElementById('clientName')?.closest('.panel');if(firstPanel){const vp=d.createElement('div');vp.className='vat-panel';vp.innerHTML='<h4>Trattamento IVA del cliente</h4><p>Regola bando: l’IVA è normalmente esclusa. Può entrare nella spesa ammissibile solo se il cliente la sostiene senza possibilità di recupero.</p><div class="vat-grid"><div class="field"><label>IVA recuperabile / detraibile dal cliente?</label><select id="vatRecoverable"><option value="yes" selected>Sì · IVA NON agevolabile</option><option value="no">No · IVA potenzialmente agevolabile</option></select></div><div class="field"><label>Regola applicata</label><div id="vatRule" class="vat-summary">Il contributo viene calcolato sull’imponibile.</div></div></div>';firstPanel.appendChild(vp);vp.querySelector('#vatRecoverable').addEventListener('change',vatUpdate)}
 const planPanel=d.getElementById('targetPlan')?.closest('.panel');if(planPanel)addVatMini(d,planPanel,'software','Pienissimo Pro / SaaS');
 const servicePanel=d.getElementById('servicePrice')?.closest('.panel');if(servicePanel)addVatMini(d,servicePanel,'service','Servizi Metallufficio');
 ensureExtraVat(d);if(observer)observer.disconnect();observer=new MutationObserver(()=>{ensureExtraVat(d);setTimeout(vatUpdate,0)});const extras=d.getElementById('extras');if(extras)observer.observe(extras,{childList:true,subtree:true});
 ['currentPlan','targetPlan','months','servicePrice','art6','premiumTitle','supplierModel'].forEach(id=>d.getElementById(id)?.addEventListener('input',()=>setTimeout(vatUpdate,0)));d.querySelectorAll('input[name="saasMode"]').forEach(x=>x.addEventListener('change',()=>setTimeout(vatUpdate,0)));
 vatUpdate();
}
function ensureExtraVat(d){d.querySelectorAll('.extra-row').forEach(r=>{if(r.querySelector('.vat-extra'))return;const box=d.createElement('div');box.className='vat-extra';box.innerHTML='<label>Prezzo inserito<select class="vat-mode-extra"><option value="net">IVA esclusa</option><option value="gross">IVA inclusa</option></select></label><label>IVA %<input class="vat-rate-extra" type="number" min="0" max="100" value="22"></label>';r.appendChild(box);box.querySelectorAll('select,input').forEach(x=>x.addEventListener('input',vatUpdate));r.querySelectorAll('.amount,.etype').forEach(x=>x.addEventListener('input',()=>setTimeout(vatUpdate,0)))})}
function vatConfig(d,key){const b=d.querySelector('[data-vat-key="'+key+'"]');return{mode:b?.querySelector('.vat-mode')?.value||'net',rate:Number(b?.querySelector('.vat-rate')?.value)||0}}
function computeVat(d){
 const recoverable=val(d,'vatRecoverable')!=='no',current=Number(val(d,'currentPlan')),target=Number(val(d,'targetPlan')),months=Math.max(1,Number(val(d,'months'))||1),mode=d.querySelector('input[name="saasMode"]:checked')?.value||'full';
 const swcfg=vatConfig(d,'software'),svcfg=vatConfig(d,'service');const fullRaw=target*months,eligibleRaw=(mode==='delta'?Math.max(0,target-current):target)*months;const fullSw=vatSplit(fullRaw,swcfg.mode,swcfg.rate),eligSw=vatSplit(eligibleRaw,swcfg.mode,swcfg.rate);const serviceRaw=num(d,'servicePrice'),svc=vatSplit(serviceRaw,svcfg.mode,svcfg.rate),art6=val(d,'art6');
 let commercialNet=fullSw.net+svc.net,commercialVat=fullSw.vat+svc.vat,eligibleNet=eligSw.net+(art6==='no'?0:svc.net),eligibleVat=eligSw.vat+(art6==='no'?0:svc.vat);const groups={goods:{net:eligSw.net,vat:eligSw.vat},consulting:{net:art6==='no'?0:svc.net,vat:art6==='no'?0:svc.vat},training:{net:0,vat:0}};
 d.querySelectorAll('.extra-row').forEach(r=>{const raw=Number(r.querySelector('.amount')?.value)||0,type=r.querySelector('.etype')?.value||'outside',m=r.querySelector('.vat-mode-extra')?.value||'net',rate=Number(r.querySelector('.vat-rate-extra')?.value)||0,s=vatSplit(raw,m,rate);commercialNet+=s.net;commercialVat+=s.vat;if(type!=='outside'&&!(art6==='no'&&(type==='consulting'||type==='training'))){eligibleNet+=s.net;eligibleVat+=s.vat;if(type==='tech'){groups.goods.net+=s.net;groups.goods.vat+=s.vat}else if(type==='consulting'){groups.consulting.net+=s.net;groups.consulting.vat+=s.vat}else if(type==='training'){groups.training.net+=s.net;groups.training.vat+=s.vat}}});
 const eligible=eligibleNet+(recoverable?0:eligibleVat),commercialGross=commercialNet+commercialVat,bonus=val(d,'premiumTitle')!=='none';let voucher=eligible>=3000?Math.min(eligible*.70,5000):0;if(voucher>0&&bonus)voucher+=Math.min(250,Math.max(0,eligible-voucher));return{recoverable,commercialNet,commercialVat,commercialGross,eligibleNet,eligibleVat,eligible,voucher,residual:Math.max(0,commercialGross-voucher),groups,fullSw,eligSw,svc};
}
function vatUpdate(){
 const d=sim.contentDocument;if(!d||!d.getElementById('vatRecoverable'))return;ensureExtraVat(d);const c=computeVat(d);const rule=d.getElementById('vatRule');if(rule)rule.textContent=c.recoverable?'IVA recuperabile: contributo calcolato sul solo imponibile.':'IVA non recuperabile: l’IVA viene inclusa nella spesa potenzialmente ammissibile.';
 const set=(id,text)=>{const n=d.getElementById(id);if(n)n.textContent=text};set('commercialTotal',money(c.commercialGross));set('eligibleTotal',money(c.eligible));set('voucherValue',money(c.voucher));set('clientResidual',money(c.residual));const es=d.getElementById('eligibleTotal')?.nextElementSibling;if(es)es.textContent=c.recoverable?'IVA esclusa · imponibile agevolabile':'IVA indetraibile inclusa · da documentare';const cs=d.getElementById('commercialTotal')?.nextElementSibling;if(cs)cs.textContent='imponibile '+money(c.commercialNet)+' + IVA '+money(c.commercialVat);
 let info=d.getElementById('vatCalcSummary');const parent=d.getElementById('eligibleTotal')?.closest('.status-card');if(!info&&parent){info=d.createElement('div');info.id='vatCalcSummary';info.style.cssText='padding:11px 14px;border-top:1px solid #e4e8ed;background:#f7f9fb;font-size:.72rem;color:#5e6671';parent.appendChild(info)}if(info)info.innerHTML='<b>IVA progetto:</b> imponibile '+money(c.commercialNet)+' · IVA '+money(c.commercialVat)+' · totale lordo '+money(c.commercialGross)+'<br><b>Base agevolabile:</b> '+money(c.eligibleNet)+(c.recoverable?' (IVA esclusa)':' + IVA indetraibile '+money(c.eligibleVat))+' = <b>'+money(c.eligible)+'</b>';
}
function buildAllegato2(){
 const d=sim.contentDocument;if(!d)return;const c=computeVat(d),current=Number(val(d,'currentPlan')),target=Number(val(d,'targetPlan')),months=Math.max(1,Number(val(d,'months'))||1),mode=d.querySelector('input[name="saasMode"]:checked')?.value||'full',art6=val(d,'art6');const cname=val(d,'clientName')||'DA COMPLETARE',city=val(d,'clientCity')||'DA COMPLETARE',region=val(d,'clientRegion')||'Abruzzo',province=val(d,'clientProvince')||'DA COMPLETARE',targetLabel=d.getElementById('targetPlan')?.selectedOptions?.[0]?.textContent?.split('·')[0].trim()||'Pienissimo Pro',packageLabel=d.getElementById('package')?.selectedOptions?.[0]?.textContent||'Servizio Metallufficio',project=d.getElementById('sheetDescription')?.textContent||'';
 const techDesc=[],consDesc=[],trainDesc=[];d.querySelectorAll('.extra-row').forEach(r=>{const t=r.querySelector('.etype')?.value,ds=r.querySelector('.desc')?.value?.trim();if(!ds)return;if(t==='tech')techDesc.push(ds);if(t==='consulting')consDesc.push(ds);if(t==='training')trainDesc.push(ds)});const objectives='Migliorare la gestione digitale dei clienti e dei processi collegati, centralizzare le informazioni, rendere più efficienti i flussi operativi e integrare la soluzione CRM con gli strumenti gestionali utilizzati dal cliente.';const goodsText='CRM SaaS Pienissimo Pro '+targetLabel+' per '+months+' mesi, tecnologia Customer Relationship Management – Art. 7, comma 1, lett. l'+(techDesc.length?'. Ulteriori beni/tecnologie: '+techDesc.join('; '):'')+'.';const consText=c.groups.consulting.net>0?(packageLabel+': configurazione, parametrizzazione, integrazione, test e verifica operativa'+(consDesc.length?'. Ulteriori attività: '+consDesc.join('; '):'')+'.'):'Non prevista.';const trainingText=c.groups.training.net>0?(trainDesc.join('; ')||'Attività formative collegate alle tecnologie digitali del progetto')+'.':'Non prevista.';
 function gross(g){return g.net+g.vat}const requested=c.voucher;const suppliers=val(d,'supplierModel')==='reseller'?[['Metallufficio Srl','Fornitura CRM SaaS e servizi di implementazione',c.eligibleNet,c.eligibleVat]]:[['Pienissimo / Zucchetti','Fornitura CRM SaaS '+targetLabel,c.groups.goods.net,c.groups.goods.vat],['Metallufficio Srl','Implementazione, configurazione e servizi tecnici',c.groups.consulting.net+c.groups.training.net,c.groups.consulting.vat+c.groups.training.vat]];const supplierRows=suppliers.map(s=>'<div class="supplier"><b>'+esc(s[0])+'</b><br>Sede legale: ____________________ · Legale rappresentante: ____________________ · P.IVA: ____________________<br>Tel./E-mail/PEC: ____________________<br><strong>Parte di intervento:</strong> '+esc(s[1])+'<br><strong>Costi:</strong> imponibile '+money(s[2])+' · IVA '+money(s[3])+' · lordo '+money(s[2]+s[3])+'</div>').join('');
 const w=window.open('','_blank');if(!w){alert('Il browser ha bloccato la finestra di stampa. Consenti i popup per questo sito.');return}const row=(name,g)=>'<tr><td>'+name+'</td><td>'+money(g.net)+'</td><td>'+money(gross(g))+'</td><td></td></tr>';
 w.document.write(`<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Bozza Allegato 2 · ${esc(cname)}</title><style>@page{size:A4;margin:13mm}*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#111;font-size:10.3pt;line-height:1.35;margin:0}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:14px}.top img{width:190px}.draft{font-weight:800;color:#9a5f00;font-size:9pt}.title{text-align:center;margin:18px 0}.title h1{font-size:18pt;margin:0}.box{border:1px solid #555;padding:10px;margin:9px 0;break-inside:avoid}.box h2{font-size:10pt;margin:0 0 7px;text-transform:uppercase}.cost{width:100%;border-collapse:collapse;margin-top:7px}.cost th,.cost td{border:1px solid #777;padding:7px}.cost th{background:#eee}.cost td:nth-child(n+2){text-align:right}.supplier{border:1px solid #777;padding:9px;margin:7px 0}.small{font-size:8.5pt;color:#555}.iva{background:#fff8e8;padding:8px;border-radius:6px;margin-top:7px}</style></head><body><div class="top"><img src="https://metallufficio-ristorazione.mikevast.chatgpt.site/logo-metallufficio.jpeg"><div class="draft">BOZZA PRECOMPILATA DAL SIMULATORE<br>da verificare sul file ufficiale prima della firma</div></div><div class="title">CAMERA DI COMMERCIO CHIETI PESCARA<h1>BANDO VOUCHER DOPPIA TRANSIZIONE 2026</h1><b>MODULO PROGETTO · ALLEGATO 2</b></div><div class="box"><h2>Misura interessata</h2>☒ Misura A – Voucher digitali &nbsp;&nbsp; ☐ Misura B – Sostenibilità aziendale ESG</div><div class="box"><h2>Impresa / sede del progetto</h2><b>${esc(cname)}</b><br>${esc(city)} · ${esc(province)} · ${esc(region)}</div><div class="box"><h2>Descrizione del progetto proposto</h2>${esc(project)}</div><div class="box"><h2>Obiettivi e risultati attesi</h2>${esc(objectives)}</div><div class="box"><h2>Beni strumentali materiali e immateriali</h2>${esc(goodsText)}</div><div class="box"><h2>Servizi di consulenza</h2>${esc(consText)}</div><div class="box"><h2>Interventi formativi</h2>${esc(trainingText)}</div><div class="box"><h2>Dettaglio costi</h2><table class="cost"><thead><tr><th>Voce</th><th>IVA esclusa</th><th>IVA inclusa</th><th>Importo richiesto</th></tr></thead><tbody>${row('Beni strumentali materiali e immateriali',c.groups.goods)}${row('Costi di consulenza',c.groups.consulting)}${row('Costi di formazione',c.groups.training)}<tr><td><b>Totale progetto agevolabile</b></td><td><b>${money(c.eligibleNet)}</b></td><td><b>${money(c.eligibleNet+c.eligibleVat)}</b></td><td><b>${money(requested)}</b></td></tr></tbody></table><div class="iva"><b>Trattamento IVA beneficiario:</b> ${c.recoverable?'IVA recuperabile/detraibile → IVA esclusa dalla spesa ammissibile.':'IVA non recuperabile/indetraibile → IVA inclusa nella spesa potenzialmente ammissibile, da documentare.'}<br><b>Spesa usata dal simulatore per il voucher:</b> ${money(c.eligible)}</div></div><div class="box"><h2>Dati dei fornitori</h2>${supplierRows}</div><p class="small">Bozza di lavoro interna. Prima dell’invio riportare i dati nel facsimile ufficiale e verificare preventivi, aliquote IVA, requisito di indetraibilità e importi richiesti.</p><script>setTimeout(()=>window.print(),350)<\/script></body></html>`);w.document.close();
}
function tune(){try{const d=sim.contentDocument;if(!d)return;const innerHeader=d.querySelector('header.header,header.site-header,.header');if(innerHeader)innerHeader.style.display='none';d.documentElement.style.scrollPaddingTop='0px';setupLocation(d);setupVat(d);const goHome=e=>{e.preventDefault();e.stopPropagation();top.location.href='index.html'};d.querySelectorAll('.brand,.brand img,.footer img,img[alt*="Metallufficio" i]').forEach(n=>{n.style.cursor='pointer';n.addEventListener('click',goHome,true)});d.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a)return;const h=a.getAttribute('href')||'';if(/^(index|home)\.html/.test(h)){e.preventDefault();top.location.href='index.html'}},true);setTimeout(vatUpdate,50)}catch(e){}if(++tries<20)setTimeout(tune,250)}
sim.addEventListener('load',()=>{tries=0;locationReady=false;vatReady=false;tune()});document.getElementById('allegato2').addEventListener('click',buildAllegato2);
</script>
</body>
</html>
