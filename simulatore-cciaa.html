<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulatore CCIAA 2026 · Metallufficio</title>
<style>
:root{--line:#e4e8ed;--body:"Aptos","Segoe UI",Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:var(--body)}.header{height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 max(16px,calc((100vw - 1180px)/2));border-bottom:1px solid var(--line);background:#fff}.brand img{display:block;width:255px;height:56px;object-fit:contain;object-position:left center}.back{border:1px solid var(--line);border-radius:13px;padding:10px 13px;text-decoration:none;color:#111318;font-weight:900;font-size:.78rem}.frame{display:block;width:100%;height:calc(100vh - 76px);border:0;background:#fff}@media(max-width:700px){.header{height:68px;padding:0 12px}.brand img{width:190px;height:46px}.frame{height:calc(100vh - 68px)}.back{padding:9px 10px;font-size:.72rem}}
</style>
</head>
<body>
<header class="header"><a class="brand" href="index.html" aria-label="Torna alla homepage"><img src="https://metallufficio-ristorazione.mikevast.chatgpt.site/logo-metallufficio.jpeg" alt="Metallufficio"></a><a class="back" href="simulatore.html">← Scegli bando</a></header>
<iframe id="sim" class="frame" src="simulatore-cciaa-base.html" title="Simulatore CCIAA Metallufficio"></iframe>
<script>
const sim=document.getElementById('sim');
let tries=0;
function tune(){
  try{
    const d=sim.contentDocument;if(!d)return;
    const innerHeader=d.querySelector('header.header,header.site-header,.header');
    if(innerHeader) innerHeader.style.display='none';
    d.documentElement.style.scrollPaddingTop='0px';
    const goHome=e=>{e.preventDefault();e.stopPropagation();top.location.href='index.html'};
    d.querySelectorAll('.brand,.brand img,.footer img,img[alt*="Metallufficio" i]').forEach(n=>{n.style.cursor='pointer';n.addEventListener('click',goHome,true)});
    d.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a)return;const h=a.getAttribute('href')||'';if(/^(index|home)\.html/.test(h)){e.preventDefault();top.location.href='index.html'}},true);
  }catch(e){}
  if(++tries<12)setTimeout(tune,250);
}
sim.addEventListener('load',()=>{tries=0;tune()});
</script>
</body>
</html>
