<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulatore CCIAA 2026 · Metallufficio</title>
<style>
:root{--line:#e4e8ed;--body:"Aptos","Segoe UI",Arial,sans-serif;--grad:linear-gradient(90deg,#E22B9C 0%,#D42CA4 12.5%,#AE2DA9 25%,#7C31AB 37.5%,#563DAE 50%,#3852B5 62.5%,#1A76BC 75%,#069BC3 87.5%,#02B3CA 100%)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:var(--body)}.header{height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 max(16px,calc((100vw - 1180px)/2));border-bottom:1px solid var(--line);background:#fff}.brand img{display:block;width:255px;height:56px;object-fit:contain;object-position:left center}.actions{display:flex;gap:8px;align-items:center}.back,.docbtn{border:1px solid var(--line);border-radius:13px;padding:10px 13px;text-decoration:none;color:#111318;font-weight:900;font-size:.78rem;background:#fff;cursor:pointer}.docbtn{border:0;color:#fff;background:var(--grad)}.frame{display:block;width:100%;height:calc(100vh - 76px);border:0;background:#fff}@media(max-width:700px){.header{height:68px;padding:0 12px}.brand img{width:175px;height:44px}.frame{height:calc(100vh - 68px)}.back,.docbtn{padding:9px 10px;font-size:.7rem}.actions{gap:5px}}@media(max-width:470px){.back{display:none}}
</style>
</head>
<body>
<header class="header"><a class="brand" href="index.html" aria-label="Torna alla homepage"><img src="https://metallufficio-ristorazione.mikevast.chatgpt.site/logo-metallufficio.jpeg" alt="Metallufficio"></a><div class="actions"><button class="docbtn" id="allegato2" type="button">Stampa Allegato 2</button><a class="back" href="simulatore.html">← Scegli bando</a></div></header>
<iframe id="sim" class="frame" src="simulatore-cciaa-base.html" title="Simulatore CCIAA Metallufficio"></iframe>
<script>
const sim=document.getElementById('sim');
const GEO_URL='https://raw.githubusercontent.com/matteocontrini/comuni-json/master/comuni.json';
const REGIONI=['Abruzzo','Basilicata','Calabria','Campania','Emilia-Romagna','Friuli-Venezia Giulia','Lazio','Liguria','Lombardia','Marche','Molise','Piemonte','Puglia','Sardegna','Sicilia','Toscana','Trentino-Alto Adige/Südtirol','Umbria','Valle d\'Aosta/Vallée d\'Aoste','Veneto'];
let geo=[],tries=0,locationReady=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const val=(d,id)=>d.getElementById(id)?.value||'';
const num=(d,id)=>Math.max(0,Number(val(d,id))||0);
const money=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(n)||0);
function normalizeComune(c){return {nome:c.nome||c.comune||'',regione:typeof c.regione==='string'?c.regione:(c.regione?.nome||''),provincia:typeof c.provincia==='string'?c.provincia:(c.provincia?.nome||''),sigla:c.sigla||c.provincia?.sigla||c.siglaProvincia||''}}
async function loadGeo(){if(geo.length)return geo;try{const r=await fetch(GEO_URL,{cache:'force-cache'});if(!r.ok)throw new Error('geo');geo=(await r.json()).map(normalizeComune).filter(x=>x.nome&&x.regione);return geo}catch(e){return []}}
function emit(el){el?.dispatchEvent(new Event('input',{bubbles:true}));el?.dispatchEvent(new Event('change',{bubbles:true}))}
async function setupLocation(d){
  if(locationReady||!d.getElementById('clientCity'))return;
  locationReady=true;
  const city=d.getElementById('clientCity');const field=city.closest('.field');const grid=field?.parentElement;if(!field||!grid)return;
  city.setAttribute('list','cciaaCities');city.placeholder='Inizia a scrivere il Comune';
  let dl=d.getElementById('cciaaCities');if(!dl){dl=d.createElement('datalist');dl.id='cciaaCities';field.appendChild(dl)}
  const rf=d.createElement('div');rf.className='field';rf.innerHTML='<label for="clientRegion">Regione</label><select id="clientRegion">'+REGIONI.map(r=>'<option'+(r==='Abruzzo'?' selected':'')+'>'+esc(r)+'</option>').join('')+'</select><small>Prima selezioniamo la Regione.</small>';
  const pf=d.createElement('div');pf.className='field';pf.innerHTML='<label for="clientProvince">Provincia</label><select id="clientProvince"><option value="">Caricamento...</option></select><small>Il Comune viene filtrato sulla Provincia.</small>';
  grid.insertBefore(rf,field);grid.insertBefore(pf,field);
  const region=rf.querySelector('select'),prov=pf.querySelector('select');
  const data=await loadGeo();
  function fillProv(){const rr=region.value;const rows=data.filter(x=>x.regione===rr);const mp=new Map();rows.forEach(x=>{if(x.provincia)mp.set(x.sigla||x.provincia,{name:x.provincia,sigla:x.sigla})});prov.innerHTML='<option value="">Seleziona Provincia</option>'+[...mp.values()].sort((a,b)=>a.name.localeCompare(b.name,'it')).map(x=>'<option value="'+esc(x.sigla||x.name)+'" data-name="'+esc(x.name)+'">'+esc(x.name)+(x.sigla?' ('+esc(x.sigla)+')':'')+'</option>').join('');if(rr==='Abruzzo'&&!rows.length)prov.innerHTML='<option value="">Seleziona Provincia</option><option value="AQ">L\'Aquila (AQ)</option><option value="CH">Chieti (CH)</option><option value="PE">Pescara (PE)</option><option value="TE">Teramo (TE)</option>';city.value='';fillCities();syncTerritory()}
  function fillCities(){const rr=region.value,pv=prov.value;let rows=data.filter(x=>x.regione===rr&&(!pv||x.sigla===pv||x.provincia===prov.options[prov.selectedIndex]?.dataset.name));dl.innerHTML=rows.sort((a,b)=>a.nome.localeCompare(b.nome,'it')).map(x=>'<option value="'+esc(x.nome)+'"></option>').join('');city.placeholder=rows.length?'Scrivi per cercare tra '+rows.length+' Comuni':'Scrivi il Comune manualmente'}
  function syncTerritory(){const t=d.querySelector('[data-check="territory"]');if(t){t.value=(region.value==='Abruzzo'&&['CH','PE'].includes(prov.value))?'yes':'no';emit(t)}}
  region.addEventListener('change',fillProv);prov.addEventListener('change',()=>{city.value='';fillCities();syncTerritory();emit(city)});
  fillProv();
  const style=d.createElement('style');style.textContent='#clientRegion,#clientProvince{min-height:44px}.geo-help{font-size:.68rem;color:#7a818b}';d.head.appendChild(style);
}
function parseEuro(t){return Number(String(t||'').replace(/[^0-9,.-]/g,'').replace(/\./g,'').replace(',','.'))||0}
function buildAllegato2(){
  const d=sim.contentDocument;if(!d)return;
  const current=Number(val(d,'currentPlan')),target=Number(val(d,'targetPlan')),months=Math.max(1,Number(val(d,'months'))||1);const mode=d.querySelector('input[name="saasMode"]:checked')?.value||'full';
  const software=mode==='delta'?Math.max(0,target-current)*months:target*months;const art6=val(d,'art6');const service=art6==='no'?0:num(d,'servicePrice');
  let goods=software,consulting=service,training=0;const techDesc=[],consDesc=[],trainDesc=[];
  d.querySelectorAll('.extra-row').forEach(r=>{const type=r.querySelector('.etype')?.value;const desc=r.querySelector('.desc')?.value?.trim()||'Voce aggiuntiva';const amount=Number(r.querySelector('.amount')?.value)||0;if(type==='tech'){goods+=amount;techDesc.push(desc)}else if(type==='consulting'){consulting+=amount;consDesc.push(desc)}else if(type==='training'){training+=amount;trainDesc.push(desc)}});
  const total=goods+consulting+training;const requested=parseEuro(d.getElementById('voucherValue')?.textContent);const cname=val(d,'clientName')||'DA COMPLETARE';const city=val(d,'clientCity')||'DA COMPLETARE';const region=val(d,'clientRegion')||'Abruzzo';const province=val(d,'clientProvince')||'DA COMPLETARE';
  const targetLabel=d.getElementById('targetPlan')?.selectedOptions?.[0]?.textContent?.split('·')[0].trim()||'Pienissimo Pro';const packageLabel=d.getElementById('package')?.selectedOptions?.[0]?.textContent||'Servizio Metallufficio';const project=d.getElementById('sheetDescription')?.textContent||'';const suppliers=val(d,'supplierModel')==='reseller'?[['Metallufficio Srl','Fornitura CRM SaaS e servizi di implementazione',total]]:[['Pienissimo / Zucchetti','Fornitura CRM SaaS '+targetLabel,software],['Metallufficio Srl','Implementazione, configurazione e servizi tecnici',consulting+training]];
  const objectives='Migliorare la gestione digitale dei clienti e dei processi collegati, centralizzare le informazioni, rendere più efficienti i flussi operativi e integrare la soluzione CRM con gli strumenti gestionali utilizzati dal cliente.';
  const goodsText='CRM SaaS Pienissimo Pro '+targetLabel+' per '+months+' mesi, tecnologia Customer Relationship Management – Art. 7, comma 1, lett. l'+(techDesc.length?'. Ulteriori beni/tecnologie: '+techDesc.join('; '):'')+'.';
  const consText=consulting>0?(packageLabel+': configurazione, parametrizzazione, integrazione, test e verifica operativa'+(consDesc.length?'. Ulteriori attività: '+consDesc.join('; '):'')+'. Collegamento: tecnologie di cui all’Art. 7, comma 1, in particolare CRM.'):'Non prevista.';
  const trainingText=training>0?trainDesc.join('; ')+'. Formazione collegata alle tecnologie digitali previste dal progetto.':'Non prevista.';
  const rows=suppliers.map(s=>'<div class="supplier"><b>'+esc(s[0])+'</b><br>Sede legale: ____________________ · Legale rappresentante: ____________________ · P.IVA: ____________________<br>Tel./E-mail/PEC: ____________________<br><strong>Parte di intervento:</strong> '+esc(s[1])+'<br><strong>Costi previsti:</strong> '+money(s[2])+'</div>').join('');
  const w=window.open('','_blank');if(!w){alert('Il browser ha bloccato la finestra di stampa. Consenti i popup per questo sito.');return}
  w.document.write(`<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Bozza Allegato 2 · ${esc(cname)}</title><style>@page{size:A4;margin:13mm}*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#111;font-size:10.5pt;line-height:1.35;margin:0}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:14px}.top img{width:190px}.draft{font-weight:800;color:#9a5f00;font-size:9pt}.title{text-align:center;margin:18px 0}.title h1{font-size:18pt;margin:0}.title p{margin:5px 0 0}.box{border:1px solid #555;padding:10px;margin:9px 0;break-inside:avoid}.box h2{font-size:10pt;margin:0 0 7px;text-transform:uppercase}.value{white-space:pre-wrap}.cost{width:100%;border-collapse:collapse;margin-top:7px}.cost th,.cost td{border:1px solid #777;padding:7px;text-align:left}.cost th{background:#eee}.cost td:nth-child(n+2){text-align:right}.supplier{border:1px solid #777;padding:9px;margin:7px 0}.manual{color:#8a5b00;font-weight:700}.small{font-size:8.5pt;color:#555}.signature{margin-top:24px;display:flex;justify-content:space-between;gap:30px}</style></head><body><div class="top"><img src="https://metallufficio-ristorazione.mikevast.chatgpt.site/logo-metallufficio.jpeg"><div class="draft">BOZZA PRECOMPILATA DAL SIMULATORE<br>da verificare sul file ufficiale prima della firma</div></div><div class="title"><div>CAMERA DI COMMERCIO INDUSTRIA ARTIGIANATO E AGRICOLTURA CHIETI PESCARA</div><h1>BANDO VOUCHER DOPPIA TRANSIZIONE 2026</h1><p><b>MODULO PROGETTO · ALLEGATO 2</b></p></div><div class="box"><h2>Misura interessata</h2>☒ Misura A – Voucher digitali &nbsp;&nbsp; ☐ Misura B – Sostenibilità aziendale ESG</div><div class="box"><h2>Impresa / sede del progetto</h2><b>${esc(cname)}</b><br>${esc(city)} · ${esc(province)} · ${esc(region)}</div><div class="box"><h2>Descrizione del progetto proposto</h2><div class="value">${esc(project)}</div></div><div class="box"><h2>Obiettivi e risultati attesi del progetto</h2><div class="value">${esc(objectives)}</div></div><div class="box"><h2>Descrizione dei beni strumentali materiali e immateriali da acquistare</h2><div class="value">${esc(goodsText)}</div></div><div class="box"><h2>Descrizione dei servizi di consulenza da acquistare</h2><div class="value">${esc(consText)}</div></div><div class="box"><h2>Descrizione degli interventi formativi da acquistare</h2><div class="value">${esc(trainingText)}</div></div><div class="box"><h2>Dettaglio dei costi del progetto</h2><table class="cost"><thead><tr><th>Voce di costo ammissibile</th><th>Totale costo IVA esclusa</th><th>Totale costo IVA inclusa</th><th>Importo richiesto</th></tr></thead><tbody><tr><td>Beni strumentali materiali e immateriali</td><td>${money(goods)}</td><td class="manual">DA COMPLETARE</td><td></td></tr><tr><td>Costi di consulenza</td><td>${money(consulting)}</td><td class="manual">DA COMPLETARE</td><td></td></tr><tr><td>Costi di formazione</td><td>${money(training)}</td><td class="manual">DA COMPLETARE</td><td></td></tr><tr><td><b>Totale progetto</b></td><td><b>${money(total)}</b></td><td class="manual"><b>DA COMPLETARE</b></td><td><b>${money(requested)}</b></td></tr></tbody></table><p class="small">L’IVA inclusa resta da riportare dai preventivi effettivi: il simulatore non presume aliquote o trattamento IVA dei singoli fornitori.</p></div><div class="box"><h2>Dati dei fornitori</h2>${rows}</div><div class="box"><h2>Campi da completare sul documento ufficiale</h2><span class="manual">Anagrafica completa dell’impresa richiedente, dati fiscali e legale rappresentante dei fornitori, eventuale IVA inclusa, recapiti, dichiarazioni e firma digitale.</span></div><div class="signature"><span>Luogo e data ____________________</span><span>Firma digitale del richiedente ____________________</span></div><script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script></body></html>`);w.document.close();
}
function tune(){
  try{
    const d=sim.contentDocument;if(!d)return;
    const innerHeader=d.querySelector('header.header,header.site-header,.header');if(innerHeader)innerHeader.style.display='none';d.documentElement.style.scrollPaddingTop='0px';
    const goHome=e=>{e.preventDefault();e.stopPropagation();top.location.href='index.html'};d.querySelectorAll('.brand,.brand img,.footer img,img[alt*="Metallufficio" i]').forEach(n=>{n.style.cursor='pointer';n.addEventListener('click',goHome,true)});
    setupLocation(d);
    ['printTop','printSheet'].forEach(id=>{const b=d.getElementById(id);if(b)b.textContent='Stampa bozza Allegato 2'});
    if(!d.documentElement.dataset.cciaaWrapper){d.documentElement.dataset.cciaaWrapper='1';d.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(a){const h=a.getAttribute('href')||'';if(/^(index|home)\.html/.test(h)){e.preventDefault();top.location.href='index.html'}}const b=e.target.closest('#printTop,#printSheet');if(b){e.preventDefault();e.stopImmediatePropagation();buildAllegato2()}},true)}
  }catch(e){}
  if(++tries<18)setTimeout(tune,250);
}
document.getElementById('allegato2').addEventListener('click',buildAllegato2);sim.addEventListener('load',()=>{tries=0;locationReady=false;tune()});
</script>
</body>
</html>
