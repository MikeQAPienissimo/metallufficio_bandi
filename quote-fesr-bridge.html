<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FESR → Preventivo Metallufficio</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Aptos,"Segoe UI",Arial,sans-serif;background:#fff}.bridge{height:100%;display:flex;flex-direction:column}.bar{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #e2e8f0;background:rgba(255,255,255,.98);backdrop-filter:blur(12px)}.bar div{min-width:0}.bar b{display:block;font-family:"Arial Black",Arial,sans-serif;font-size:14px}.bar span{display:block;color:#64748b;font-size:10px;margin-top:2px}.btn{border:0;border-radius:12px;padding:11px 15px;color:#fff;font-weight:900;cursor:pointer;white-space:nowrap;background:linear-gradient(90deg,#E22B9C,#7C31AB,#069BC3)}.frame{width:100%;flex:1;min-height:1180px;border:0}.toast{position:fixed;right:18px;bottom:18px;z-index:50;background:#111827;color:#fff;border-radius:12px;padding:10px 13px;font-size:11px;opacity:0;transform:translateY(8px);transition:.18s}.toast.show{opacity:1;transform:none}@media(max-width:650px){.bar{align-items:flex-start;flex-direction:column}.btn{width:100%}.frame{min-height:1450px}}</style></head><body><div class="bridge"><div class="bar"><div><b>FESR · calcolo preventivo</b><span>Compila solo i dati utili e trasferisci il risultato in Quote.</span></div><button class="btn" id="send">Porta nel preventivo →</button></div><iframe id="wrapper" class="frame" src="./fesr-simulatore.html" title="Simulatore FESR"></iframe></div><div class="toast" id="toast"></div><script>
const TARGET='https://quote-aziendali.netlify.app',wrapper=document.getElementById('wrapper');
const toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)};
const val=(d,s)=>d.querySelector(s)?.value||'';
function compactify(){try{const od=wrapper.contentDocument;if(!od)return;let ws=od.getElementById('mqQuoteCompactWrapper');if(!ws){ws=od.createElement('style');ws.id='mqQuoteCompactWrapper';ws.textContent='.header{display:none!important}.frame{min-height:1120px!important;height:auto!important}.embedded .frame{min-height:1120px!important}body{background:#fff!important}';od.head.appendChild(ws)}const nested=od.getElementById('sim');const apply=()=>{try{const d=nested?.contentDocument;if(!d)return;if(d.getElementById('mqQuoteCompactBase'))return;const s=d.createElement('style');s.id='mqQuoteCompactBase';s.textContent='.hero{display:none!important}.main{padding-top:10px!important}.wrap{max-width:1180px!important}.layout{grid-template-columns:minmax(0,1fr)!important}.summary{position:static!important;top:auto!important}.card{margin-bottom:10px!important}.card-head{padding:12px 14px!important}.card-head p,.card-head .step,.internal-note,.info-btn,.chips,.kicker,.title-with-info .info-btn{display:none!important}.card-body{padding:12px 14px!important}.requirements .req span,.field small,.connect-head .orange,#cdesc{display:none!important}.requirements{gap:6px!important}.req{padding:8px 10px!important}.needs{gap:7px!important}.need small{display:none!important}.finance-grid{gap:8px!important}.band>p{display:none!important}.actions{gap:6px!important}.sidebar,.summary{box-shadow:none!important}@media(max-width:700px){.main{padding:6px!important}.card-head,.card-body{padding:10px!important}}';d.head.appendChild(s)}catch(e){console.warn(e)}};nested?.addEventListener('load',apply,{once:true});apply();setTimeout(apply,350)}catch(e){console.warn(e)}}
wrapper.addEventListener('load',()=>{compactify();setTimeout(compactify,350)});setTimeout(compactify,700);
function build(){try{const ow=wrapper.contentWindow,od=wrapper.contentDocument,nested=od?.getElementById('sim'),d=nested?.contentDocument;if(!ow||!d||typeof ow.fesrVatCalc!=='function')throw new Error('Il simulatore non è ancora pronto.');const calc=ow.fesrVatCalc(d),items=[...d.querySelectorAll('.item')],calcLines=calc.lines||[],rows=items.map((el,i)=>{const desc=el.querySelector('.i-desc')?.value?.trim()||`Voce progetto ${i+1}`,pay=el.querySelector('.i-pay')?.value||'once',months=Math.max(1,Number(el.querySelector('.i-months')?.value)||1),cat=el.querySelector('.i-cat')?.value||'X',vr=Math.max(0,Number(el.querySelector('.vat-rate')?.value)||22),line=calcLines[i]||{},net=Math.max(0,Number(line.net)||0),unit=pay==='monthly'?net/months:net,group=cat==='A'?'hardware':cat==='B'?'software':['C','D','E','S'].includes(cat)?'services':'other';return{description:desc,quantity:1,unit_price:unit,price_type:pay==='monthly'?'monthly':'one_off',months:pay==='monthly'?months:null,line_total:net,vat_rate:vr,group,eligible_amount:Number(line.eligible)||0,source_category:cat}}).filter(r=>r.line_total>0||r.unit_price>0);const payload={type:'mq-bando-quote',bando:'fesr',client:{business_name:val(d,'#cliente'),legal_name:val(d,'#cliente'),legal_city:val(d,'#comune')},projectDescription:d.getElementById('recapText')?.value?.trim()||'',rows,summary:{commercialNet:Number(calc.commercialNet)||0,commercialVat:Number(calc.commercialVat)||0,commercialGross:Number(calc.commercialGross)||0,eligible:Number(calc.eligible)||0,grant:Number(calc.grant)||0,residual:Number(calc.residual)||0}};if(!rows.length)throw new Error('Inserisci almeno una voce economica nella simulazione.');window.parent.postMessage(payload,TARGET);toast('Simulazione inviata al preventivo.')}catch(e){console.error(e);toast(e.message||String(e))}}
document.getElementById('send').onclick=build;
</script></body></html>
