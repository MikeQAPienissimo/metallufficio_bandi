<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FESR → Preventivo Metallufficio</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Aptos,"Segoe UI",Arial,sans-serif;background:#fff}.bridge{height:100%;display:flex;flex-direction:column}.bar{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #e2e8f0;background:rgba(255,255,255,.97);backdrop-filter:blur(12px)}.bar div{min-width:0}.bar b{display:block;font-family:"Arial Black",Arial,sans-serif;font-size:14px}.bar span{display:block;color:#64748b;font-size:10px;margin-top:2px}.btn{border:0;border-radius:12px;padding:11px 15px;color:#fff;font-weight:900;cursor:pointer;white-space:nowrap;background:linear-gradient(90deg,#E22B9C,#7C31AB,#069BC3)}.frame{width:100%;flex:1;min-height:1000px;border:0}.toast{position:fixed;right:18px;bottom:18px;z-index:50;background:#111827;color:#fff;border-radius:12px;padding:10px 13px;font-size:11px;opacity:0;transform:translateY(8px);transition:.18s}.toast.show{opacity:1;transform:none}@media(max-width:650px){.bar{align-items:flex-start;flex-direction:column}.btn{width:100%}}</style></head><body><div class="bridge"><div class="bar"><div><b>Simulatore FESR 1.2.2</b><span>Completa la simulazione, poi porta le voci nel preventivo Metallufficio.</span></div><button class="btn" id="send">Porta nel preventivo →</button></div><iframe id="wrapper" class="frame" src="./fesr-simulatore.html" title="Simulatore FESR"></iframe></div><div class="toast" id="toast"></div><script>
const TARGET='https://quote-aziendali.netlify.app',wrapper=document.getElementById('wrapper');
const toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)};
const val=(d,s)=>d.querySelector(s)?.value||'';
function build(){try{const ow=wrapper.contentWindow,od=wrapper.contentDocument,nested=od?.getElementById('sim'),d=nested?.contentDocument;if(!ow||!d||typeof ow.fesrVatCalc!=='function')throw new Error('Il simulatore non è ancora pronto.');const calc=ow.fesrVatCalc(d),items=[...d.querySelectorAll('.item')],calcLines=calc.lines||[],rows=items.map((el,i)=>{const desc=el.querySelector('.i-desc')?.value?.trim()||`Voce progetto ${i+1}`,pay=el.querySelector('.i-pay')?.value||'once',months=Math.max(1,Number(el.querySelector('.i-months')?.value)||1),cat=el.querySelector('.i-cat')?.value||'X',vr=Math.max(0,Number(el.querySelector('.vat-rate')?.value)||22),line=calcLines[i]||{},net=Math.max(0,Number(line.net)||0),unit=pay==='monthly'?net/months:net,group=cat==='A'?'hardware':cat==='B'?'software':['C','D','E','S'].includes(cat)?'services':'other';return{description:desc,quantity:1,unit_price:unit,price_type:pay==='monthly'?'monthly':'one_off',months:pay==='monthly'?months:null,line_total:net,vat_rate:vr,group,eligible_amount:Number(line.eligible)||0,source_category:cat}}).filter(r=>r.line_total>0||r.unit_price>0);const payload={type:'mq-bando-quote',bando:'fesr',client:{business_name:val(d,'#cliente'),legal_name:val(d,'#cliente'),legal_city:val(d,'#comune')},projectDescription:d.getElementById('recapText')?.value?.trim()||'',rows,summary:{commercialNet:Number(calc.commercialNet)||0,commercialVat:Number(calc.commercialVat)||0,commercialGross:Number(calc.commercialGross)||0,eligible:Number(calc.eligible)||0,grant:Number(calc.grant)||0,residual:Number(calc.residual)||0}};if(!rows.length)throw new Error('Inserisci almeno una voce economica nella simulazione.');window.parent.postMessage(payload,TARGET);toast('Simulazione inviata al preventivo.')}catch(e){console.error(e);toast(e.message||String(e))}}
document.getElementById('send').onclick=build;
</script></body></html>
