<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCIAA vs FESR 2026 · Metallufficio</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
#site{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
.simula{position:fixed;z-index:9999;top:17px;right:132px;display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 17px;border:0;border-radius:13px;color:#fff;text-decoration:none;font:900 13px/1 Aptos,"Segoe UI",Arial,sans-serif;letter-spacing:.01em;background:linear-gradient(90deg,#E22B9C 0%,#D42CA4 12.5%,#AE2DA9 25%,#7C31AB 37.5%,#563DAE 50%,#3852B5 62.5%,#1A76BC 75%,#069BC3 87.5%,#02B3CA 100%);box-shadow:0 8px 22px rgba(56,82,181,.2);transition:transform .15s ease,box-shadow .15s ease}
.simula:hover{transform:translateY(-1px);box-shadow:0 11px 28px rgba(56,82,181,.26)}
.simula:focus-visible{outline:3px solid rgba(56,82,181,.28);outline-offset:3px}
@media(max-width:1000px){.simula{right:16px}}
@media(max-width:700px){.simula{top:13px;right:13px;min-height:40px;padding:0 14px;font-size:12px}}
@media print{.simula{display:none}}
</style>
</head>
<body>
<a class="simula" href="simulatore.html" title="Apri il simulatore interno">SIMULA</a>
<iframe id="site" src="home.html" title="Confronto bandi Metallufficio"></iframe>
<script>
const frame=document.getElementById('site');
const allowedPages=new Set(['home.html','cciaa.html','fesr.html']);

function cleanPage(value){
  const raw=(value||'').split('#')[0].split('?')[0];
  return allowedPages.has(raw)?raw:'home.html';
}

function pageFromUrl(){
  const p=new URLSearchParams(location.search).get('page');
  return cleanPage(p?`${p}.html`:'home.html');
}

function loadPage(page,push=true){
  const clean=cleanPage(page);
  if(frame.getAttribute('src')!==clean) frame.setAttribute('src',clean);
  if(push){
    const key=clean.replace('.html','');
    const url=key==='home'?'./':`?page=${encodeURIComponent(key)}`;
    history.pushState({page:clean},'',url);
  }
}

frame.setAttribute('src',pageFromUrl());

frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    doc.addEventListener('click',e=>{
      const a=e.target.closest('a[href]');
      if(!a)return;
      const href=a.getAttribute('href')||'';

      if(/^simulatore\.html(?:[?#].*)?$/.test(href)){
        e.preventDefault();
        window.location.href=href;
        return;
      }

      if(/^(home|cciaa|fesr)\.html(?:[?#].*)?$/.test(href)){
        e.preventDefault();
        loadPage(href,true);
      }
    },true);
  }catch(err){}
});

window.addEventListener('popstate',()=>loadPage(pageFromUrl(),false));
</script>
</body>
</html>
