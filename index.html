<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCIAA vs FESR 2026 · Metallufficio</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
#site{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
.simula{position:fixed;z-index:9999;top:17px;right:132px;display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 17px;border:0;border-radius:13px;color:#fff;text-decoration:none;font:900 13px/1 Aptos,"Segoe UI",Arial,sans-serif;letter-spacing:.01em;background:linear-gradient(90deg,#E22B9C 0%,#D42CA4 12.5%,#AE2DA9 25%,#7C31AB 37.5%,#563DAE 50%,#3852B5 62.5%,#1A76BC 75%,#069BC3 87.5%,#02B3CA 100%);box-shadow:0 8px 22px rgba(56,82,181,.2);transition:transform .15s ease,box-shadow .15s ease}
.simula:hover{transform:translateY(-1px);box-shadow:0 11px 28px rgba(56,82,181,.26)}
.simula:focus-visible{outline:3px solid rgba(56,82,181,.28);outline-offset:3px}
@media(max-width:1000px){.simula{right:16px}}
@media(max-width:700px){.simula{top:13px;right:13px;min-height:40px;padding:0 14px;font-size:12px}}
@media print{.simula{display:none}}
</style>
</head>
<body>
<a class="simula" href="simulatore.html" title="Scegli il simulatore interno">SIMULA</a>
<iframe id="site" src="home-base.html" title="Confronto bandi Metallufficio"></iframe>
<script>
const frame=document.getElementById('site');
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;
    const style=d.createElement('style');
    style.textContent=`
      .brand,.brand img,.footer img{cursor:pointer}
      #bandiInfo{padding:22px 0 28px;background:#fff;border-top:1px solid var(--line,#e4e8ed);border-bottom:1px solid var(--line,#e4e8ed)}
      #bandiInfo .bi-wrap{width:min(calc(100% - 34px),1180px);margin:auto}
      #bandiInfo .bi-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:15px}
      #bandiInfo .bi-head strong{font-family:"Arial Black",Arial,sans-serif;font-size:clamp(1.45rem,2.5vw,2.2rem);letter-spacing:-.035em}
      #bandiInfo .bi-head span{color:#69717b;font-size:.84rem;max-width:640px}
      #bandiInfo .bi-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
      #bandiInfo .bi-card{position:relative;overflow:hidden;border:1px solid #e4e8ed;border-radius:22px;background:#fff;padding:20px;box-shadow:0 10px 30px rgba(17,19,24,.055)}
      #bandiInfo .bi-card:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#E22B9C 0%,#D42CA4 12.5%,#AE2DA9 25%,#7C31AB 37.5%,#563DAE 50%,#3852B5 62.5%,#1A76BC 75%,#069BC3 87.5%,#02B3CA 100%)}
      #bandiInfo .bi-tag{display:inline-flex;border-radius:999px;background:#f1f3f5;padding:6px 9px;font-size:.66rem;font-weight:950;text-transform:uppercase;letter-spacing:.06em;color:#5f6771}
      #bandiInfo h3{font-family:"Arial Black",Arial,sans-serif;font-size:1.18rem;margin:13px 0 0;letter-spacing:-.025em}
      #bandiInfo p{margin:8px 0 0;color:#626a75;font-size:.86rem;line-height:1.5}
      #bandiInfo .bi-hook{margin-top:12px;border-radius:14px;background:#f7f8fa;padding:11px 12px;font-weight:850;font-size:.8rem;color:#30343a}
      #bandiInfo .bi-cta{display:inline-flex;align-items:center;justify-content:center;margin-top:14px;min-height:42px;padding:0 13px;border-radius:12px;background:#111318;color:#fff!important;text-decoration:none!important;font-size:.76rem;font-weight:950}
      #bandiInfo .bi-cta:hover{background:#262a30}
      @media(max-width:760px){#bandiInfo{padding:18px 0 22px}#bandiInfo .bi-head{display:block}#bandiInfo .bi-head span{display:block;margin-top:7px}#bandiInfo .bi-grid{grid-template-columns:1fr}#bandiInfo .bi-card{padding:17px}}
    `;
    d.head.appendChild(style);

    if(!d.getElementById('bandiInfo')){
      const hero=d.querySelector('.hero');
      if(hero){
        const section=d.createElement('section');
        section.id='bandiInfo';
        section.innerHTML=`<div class="bi-wrap">
          <div class="bi-head"><strong>Da quale opportunità vuoi partire?</strong><span>Due bandi, due logiche diverse. Apri la guida giusta prima di costruire la proposta al cliente.</span></div>
          <div class="bi-grid">
            <article class="bi-card"><span class="bi-tag">Voucher CCIAA</span><h3>Hai un progetto digitale da almeno €3.000?</h3><p>Il Voucher Doppia Transizione può essere la strada più rapida per CRM, software e servizi di implementazione coerenti con il bando.</p><div class="bi-hook">Fino al 70% di contributo, con voucher massimo di €5.000 + eventuale premialità.</div><a class="bi-cta" href="cciaa.html">INFORMATI SUL BANDO CCIAA →</a></article>
            <article class="bi-card"><span class="bi-tag">PR Abruzzo FESR</span><h3>Il cliente vuole fare un salto digitale più strutturato?</h3><p>Il FESR è pensato per progetti più ampi e organici: processi, infrastruttura, software, integrazioni e crescita digitale vanno letti come un unico progetto.</p><div class="bi-hook">Capisci prima perimetro, spese, punteggio e sostenibilità della proposta.</div><a class="bi-cta" href="fesr.html">INFORMATI SUL FESR →</a></article>
          </div>
        </div>`;
        hero.insertAdjacentElement('afterend',section);
      }
    }

    const goHome=e=>{e.preventDefault();e.stopPropagation();top.location.href='index.html'};
    d.querySelectorAll('.brand,.brand img,.footer img,img[alt*="Metallufficio" i]').forEach(node=>node.addEventListener('click',goHome,true));
    d.addEventListener('click',e=>{
      const a=e.target.closest('a[href]');
      if(!a)return;
      const href=a.getAttribute('href')||'';
      if(/^(cciaa|fesr|simulatore)\.html(?:[?#].*)?$/.test(href)){
        e.preventDefault();top.location.href=href;
      }
    },true);
  }catch(err){console.error(err)}
});
</script>
</body>
</html>
