<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCIAA vs FESR 2026 · Metallufficio</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
#site{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
.tool{position:fixed;z-index:9999;top:17px;display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 17px;border-radius:13px;text-decoration:none;font:900 13px/1 Aptos,"Segoe UI",Arial,sans-serif;letter-spacing:.01em;transition:transform .15s ease,box-shadow .15s ease}
.simula{right:132px;border:0;color:#fff;background:linear-gradient(90deg,#E22B9C 0%,#D42CA4 12.5%,#AE2DA9 25%,#7C31AB 37.5%,#563DAE 50%,#3852B5 62.5%,#1A76BC 75%,#069BC3 87.5%,#02B3CA 100%);box-shadow:0 8px 22px rgba(56,82,181,.2)}
.valuta{right:238px;border:1px solid #d6dbe1;color:#111318;background:#fff;box-shadow:0 7px 20px rgba(17,19,24,.09)}
.tool:hover{transform:translateY(-1px)}.simula:hover{box-shadow:0 11px 28px rgba(56,82,181,.26)}.valuta:hover{box-shadow:0 10px 25px rgba(17,19,24,.13)}
.tool:focus-visible{outline:3px solid rgba(56,82,181,.28);outline-offset:3px}
@media(max-width:1000px){.simula{right:16px}.valuta{right:122px}}
@media(max-width:700px){.tool{top:13px;min-height:40px;padding:0 12px;font-size:11px}.simula{right:13px}.valuta{right:98px}}
@media(max-width:440px){.valuta{right:90px}.tool{padding:0 10px;font-size:10px}}
@media print{.tool{display:none}}
</style>
</head>
<body>
<a class="tool valuta" href="valuta-progetto.html" title="Valuta un progetto ricevuto">VALUTA PROGETTO</a>
<a class="tool simula" href="simulatore.html" title="Scegli il simulatore interno">SIMULA</a>
<iframe id="site" src="home-base.html" title="Confronto bandi Metallufficio"></iframe>
<script>
const frame=document.getElementById('site');
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;
    const style=d.createElement('style');
    style.textContent=`
      .brand,.brand img,.footer img{cursor:pointer}
      #bandiInfo{padding:22px 0 28px;background:#fff;border-top:1px solid var(--line,#e4e8ed);border-bottom:1px solid var(--line,#e4e8ed)}
      #bandiInfo .bi-wrap{width:min(calc(100% - 34px),1180px);margin:auto}
      #bandiInfo .bi-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:15px}
      #bandiInfo .bi-head strong{font-family:"Arial Black",Arial,sans-serif;font-size:clamp(1.45rem,2.5vw,2.2rem);letter-spacing:-.035em}
      #bandiInfo .bi-head span{color:#69717b;font-size:.84rem;max-width:650px}
      #bandiInfo .bi-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
      #bandiInfo .bi-card{position:relative;overflow:hidden;border:1px solid #e4e8ed;border-radius:22px;background:#fff;padding:20px;box-shadow:0 10px 30px rgba(17,19,24,.055)}
      #bandiInfo .bi-card:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#E22B9C 0%,#D42CA4 12.5%,#AE2DA9 25%,#7C31AB 37.5%,#563DAE 50%,#3852B5 62.5%,#1A76BC 75%,#069BC3 87.5%,#02B3CA 100%)}
      #bandiInfo .bi-wide{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;background:#fafbfc}
      #bandiInfo .bi-tag{display:inline-flex;border-radius:999px;background:#f1f3f5;padding:6px 9px;font-size:.66rem;font-weight:950;text-transform:uppercase;letter-spacing:.06em;color:#5f6771}
      #bandiInfo h3{font-family:"Arial Black",Arial,sans-serif;font-size:1.18rem;margin:13px 0 0;letter-spacing:-.025em}
      #bandiInfo p{margin:8px 0 0;color:#626a75;font-size:.86rem;line-height:1.5}
      #bandiInfo .bi-hook{margin-top:12px;border-radius:14px;background:#f7f8fa;padding:11px 12px;font-weight:850;font-size:.8rem;color:#30343a}
      #bandiInfo .bi-cta{display:inline-flex;align-items:center;justify-content:center;margin-top:14px;min-height:42px;padding:0 13px;border-radius:12px;background:#111318;color:#fff!important;text-decoration:none!important;font-size:.76rem;font-weight:950}
      #bandiInfo .bi-wide .bi-cta{margin-top:0;min-width:190px;background:linear-gradient(90deg,#AE2DA9,#3852B5,#069BC3)}
      #bandiInfo .bi-cta:hover{filter:brightness(.94)}
      @media(max-width:760px){#bandiInfo{padding:18px 0 22px}#bandiInfo .bi-head{display:block}#bandiInfo .bi-head span{display:block;margin-top:7px}#bandiInfo .bi-grid{grid-template-columns:1fr}#bandiInfo .bi-card{padding:17px}#bandiInfo .bi-wide{grid-column:auto;grid-template-columns:1fr}#bandiInfo .bi-wide .bi-cta{margin-top:3px}}
    `;
    d.head.appendChild(style);
    if(!d.getElementById('bandiInfo')){
      const hero=d.querySelector('.hero');
      if(hero){
        const section=d.createElement('section');section.id='bandiInfo';section.innerHTML=`<div class="bi-wrap">
          <div class="bi-head"><strong>Quale opportunità possiamo valutare per il cliente?</strong><span>Due bandi, due logiche diverse. Qui capiamo quale approfondire prima di costruire la proposta commerciale e il progetto del cliente.</span></div>
          <div class="bi-grid">
            <article class="bi-card"><span class="bi-tag">Voucher CCIAA</span><h3>Il cliente ha un progetto digitale da almeno €3.000?</h3><p>Il Voucher Doppia Transizione può essere la strada più rapida quando il cliente deve introdurre o far evolvere CRM, software e servizi di implementazione coerenti con il bando.</p><div class="bi-hook">Per il cliente: contributo fino al 70%, voucher massimo €5.000 + eventuale premialità di €250.</div><a class="bi-cta" href="cciaa.html">APRI GUIDA CCIAA →</a></article>
            <article class="bi-card"><span class="bi-tag">PR Abruzzo FESR</span><h3>Il cliente sta pianificando un investimento digitale più strutturato?</h3><p>Il FESR ha senso quando il cliente deve costruire un progetto organico che unisce processi, software, infrastruttura, integrazioni e crescita digitale.</p><div class="bi-hook">Per il cliente: investimento minimo €10.000, intensità potenziale 40–70% e contributo fino a €100.000.</div><a class="bi-cta" href="fesr.html">APRI GUIDA FESR →</a></article>
            <article class="bi-card bi-wide"><div><span class="bi-tag">Controllo pre-istruttoria</span><h3>Abbiamo già ricevuto il progetto del cliente?</h3><p>Carichiamo PDF o DOCX e lo facciamo leggere come farebbe un istruttore: punteggio potenziale, rischi di taglio, incoerenze, prove mancanti e correzioni da fare prima della presentazione. Possiamo poi rigenerare una versione più solida.</p></div><a class="bi-cta" href="valuta-progetto.html">VALUTA IL PROGETTO →</a></article>
          </div></div>`;hero.insertAdjacentElement('afterend',section)
      }
    }
    const goHome=e=>{e.preventDefault();e.stopPropagation();top.location.href='index.html'};d.querySelectorAll('.brand,.brand img,.footer img,img[alt*="Metallufficio" i]').forEach(node=>node.addEventListener('click',goHome,true));
    d.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a)return;const href=a.getAttribute('href')||'';if(/^(cciaa|fesr|simulatore|valuta-progetto)\.html(?:[?#].*)?$/.test(href)){e.preventDefault();top.location.href=href}},true)
  }catch(err){console.error(err)}
});
</script>
</body>
</html>
