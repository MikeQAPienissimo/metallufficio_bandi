name: Uniforma logo Metallufficio

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-logo.yml'

permissions:
  contents: write

jobs:
  sync-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sostituisci riferimenti logo
        run: |
          python - <<'PY'
          from pathlib import Path
          old = [
              'metallufficio-logo.svg',
              'https://metallufficio-ristorazione.mikevast.chatgpt.site/logo-metallufficio.jpeg'
          ]
          new = 'metallufficio-logo.jpeg'
          exts = {'.html','.js','.css','.md','.txt','.json','.mjs','.mts','.ts'}
          changed = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in exts:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              n = s
              for token in old:
                  n = n.replace(token,new)
              if n != s:
                  p.write_text(n,encoding='utf-8')
                  changed.append(str(p))
          svg = Path('metallufficio-logo.svg')
          if svg.exists():
              svg.unlink()
              changed.append(str(svg))
          print('File aggiornati:')
          print('\n'.join(changed) if changed else 'nessuno')
          PY
      - name: Commit modifiche
        run: |
          if git diff --quiet; then
            echo "Nessuna modifica necessaria"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Usa sempre il logo ufficiale Metallufficio"
          git push origin main
