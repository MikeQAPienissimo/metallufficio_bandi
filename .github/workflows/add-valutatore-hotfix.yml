name: Collega hotfix PDF valutatore
on:
  push:
    paths:
      - 'valuta-progetto-pdf-hotfix.js'
      - '.github/workflows/add-valutatore-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collega script hotfix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('valuta-progetto.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="valuta-progetto-pdf-hotfix.js?v=20260915-2"></script>'
          if tag not in s:
              s=s.replace('</body></html>',tag+'\n</body></html>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add valuta-progetto.html
          git commit -m 'Attiva hotfix Unicode PDF nel valutatore'
          git push