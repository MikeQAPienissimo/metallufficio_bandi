name: Attiva hotfix PDF v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sostituisce hotfix ricorsivo
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('valuta-progetto.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="valuta-progetto-pdf-hotfix.js?v=20260915-2"></script>'
          new='<script src="valuta-progetto-pdf-hotfix-v2.js?v=20260915-3"></script>'
          if old not in s and new not in s:
              raise SystemExit('Riferimento hotfix non trovato')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add valuta-progetto.html
          git commit -m "Usa hotfix PDF v2 senza loop MutationObserver"
          git push