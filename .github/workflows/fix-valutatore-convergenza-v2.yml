name: Corregge convergenza valutatore
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-valutatore-convergenza-v2.yml'
      - 'scripts/fix_valutatore_convergenza.py'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Applica patch convergenza
        run: python scripts/fix_valutatore_convergenza.py
      - name: Debug e test statici
        run: |
          node --check valuta-progetto-async.js
          node --check valuta-progetto-controller.js
          grep -q 'projectContributionRate' valuta-progetto.html
          grep -q 'DOCUMENT_SCOPE_RULES' netlify/functions/valuta-progetto-async-background.mts
          grep -q 'OBIETTIVO DI CONVERGENZA' netlify/functions/valuta-progetto-async-background.mts
          grep -q 'OBIETTIVO DI CONVERGENZA' netlify/functions/valuta-template-async-background.mts
          grep -q 'friendlyAiError' valuta-progetto-async.js
          grep -q 'friendlyAiError' valuta-progetto-controller.js
          git diff --check
      - name: Commit patch applicata
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add valuta-progetto.html valuta-progetto-async.js valuta-progetto-controller.js netlify/functions/valuta-progetto-async-background.mts netlify/functions/valuta-template-async-background.mts
          git commit -m "Allinea analisi e rigenerazione del valutatore"
          git push
